# =============================================================================
# MySQL Exporter 템플릿
# Aurora MySQL 및 RDS MySQL 인스턴스 모니터링용
# 환경변수 치환(envsubst)으로 동적 생성됩니다.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${DEPLOY_NAME}
  namespace: ${TARGET_NAMESPACE}
  labels:
    app: mysql-exporter
    db-discovery/managed-by: auto-discovery
    db-discovery/exporter-type: mysql
    db-discovery/source-type: ${SOURCE_TYPE}
  annotations:
    db-discovery/db-identifier: "${DB_IDENTIFIER}"
    db-discovery/endpoint: "${DB_ENDPOINT}"
    db-discovery/port: "${DB_PORT}"
    db-discovery/engine: "mysql"
    db-discovery/cluster-id: "${CLUSTER_ID}"
    db-discovery/created-at: "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
spec:
  replicas: 1
  # HA: 업데이트 시에도 기존 Pod 유지 (메트릭 갭 방지)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: mysql-exporter
      db-instance: ${DB_IDENTIFIER}
  template:
    metadata:
      labels:
        app: mysql-exporter
        db-instance: ${DB_IDENTIFIER}
        db-discovery/managed-by: auto-discovery
      annotations:
        # ADOT Collector가 이 Pod을 자동으로 scrape하도록 설정
        prometheus.io/scrape: "true"
        prometheus.io/port: "9104"
        prometheus.io/path: "/metrics"
    spec:
      # 빠른 종료 (기본 30초 → 5초)
      terminationGracePeriodSeconds: 5
      # 리소스 부족 시 eviction 방지
      priorityClassName: db-exporter-priority
      # 노드 장애 시 빠른 재스케줄링 (300초 → 10초)
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 10
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 10
      containers:
        - name: mysqld-exporter
          image: ${EXPORTER_IMAGE}
          ports:
            - containerPort: 9104
              name: metrics
              protocol: TCP
          env:
            # DATA_SOURCE_NAME: DB 접속 DSN
            # 형식: user:password@tcp(host:port)/
            - name: DATA_SOURCE_NAME
              value: "$(MYSQL_USER):$(MYSQL_PASSWORD)@tcp(${DB_ENDPOINT}:${DB_PORT})/"
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: ${SECRET_NAME}
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${SECRET_NAME}
                  key: password
          args:
            # 수집할 메트릭 카테고리 (성능에 영향 최소화)
            - "--collect.info_schema.tables"
            - "--collect.info_schema.innodb_metrics"
            - "--collect.info_schema.processlist"
            - "--collect.global_status"
            - "--collect.global_variables"
            - "--collect.slave_status"
            - "--collect.engine_innodb_status"
            - "--collect.perf_schema.eventswaits"
            - "--collect.perf_schema.file_events"
            - "--collect.perf_schema.tableiowaits"
            - "--collect.perf_schema.tablelocks"
            - "--collect.auto_increment.columns"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # 빠른 복구: 문제 감지 5초, 재시작까지 총 10초
          startupProbe:
            httpGet:
              path: /metrics
              port: 9104
            periodSeconds: 2
            failureThreshold: 15
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9104
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9104
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 1

---
apiVersion: v1
kind: Service
metadata:
  name: ${DEPLOY_NAME}
  namespace: ${TARGET_NAMESPACE}
  labels:
    app: mysql-exporter
    db-discovery/managed-by: auto-discovery
    db-instance: ${DB_IDENTIFIER}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9104"
    prometheus.io/path: "/metrics"
    db-discovery/db-identifier: "${DB_IDENTIFIER}"
    db-discovery/endpoint: "${DB_ENDPOINT}"
spec:
  type: ClusterIP
  ports:
    - port: 9104
      targetPort: 9104
      protocol: TCP
      name: metrics
  selector:
    app: mysql-exporter
    db-instance: ${DB_IDENTIFIER}
