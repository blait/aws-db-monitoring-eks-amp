# =============================================================================
# PostgreSQL Exporter 템플릿
# Aurora PostgreSQL 및 RDS PostgreSQL 인스턴스 모니터링용
# 환경변수 치환(envsubst)으로 동적 생성됩니다.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${DEPLOY_NAME}
  namespace: ${TARGET_NAMESPACE}
  labels:
    app: postgresql-exporter
    db-discovery/managed-by: auto-discovery
    db-discovery/exporter-type: postgresql
    db-discovery/source-type: ${SOURCE_TYPE}
  annotations:
    db-discovery/db-identifier: "${DB_IDENTIFIER}"
    db-discovery/endpoint: "${DB_ENDPOINT}"
    db-discovery/port: "${DB_PORT}"
    db-discovery/engine: "postgresql"
    db-discovery/cluster-id: "${CLUSTER_ID}"
    db-discovery/created-at: "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
spec:
  replicas: 1
  # HA: 업데이트 시에도 기존 Pod 유지 (메트릭 갭 방지)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: postgresql-exporter
      db-instance: ${DB_IDENTIFIER}
  template:
    metadata:
      labels:
        app: postgresql-exporter
        db-instance: ${DB_IDENTIFIER}
        db-discovery/managed-by: auto-discovery
      annotations:
        # ADOT Collector가 이 Pod을 자동으로 scrape하도록 설정
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: "/metrics"
    spec:
      # 빠른 종료 (기본 30초 → 5초)
      terminationGracePeriodSeconds: 5
      # 리소스 부족 시 eviction 방지
      priorityClassName: db-exporter-priority
      # 노드 장애 시 빠른 재스케줄링 (300초 → 10초)
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 10
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 10
      containers:
        - name: postgres-exporter
          image: ${EXPORTER_IMAGE}
          ports:
            - containerPort: 9187
              name: metrics
              protocol: TCP
          env:
            # DATA_SOURCE_NAME: PostgreSQL 접속 URI
            - name: DATA_SOURCE_URI
              value: "${DB_ENDPOINT}:${DB_PORT}/postgres?sslmode=require"
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: ${SECRET_NAME}
                  key: username
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: ${SECRET_NAME}
                  key: password
            # 추가 설정
            - name: PG_EXPORTER_AUTO_DISCOVER_DATABASES
              value: "true"
            - name: PG_EXPORTER_EXCLUDE_DATABASES
              value: "template0,template1,rdsadmin"
          args:
            - "--auto-discover-databases"
            - "--exclude-databases=template0,template1,rdsadmin"
            - "--collector.database"
            - "--collector.locks"
            - "--collector.postmaster"
            - "--collector.process_idle"
            - "--collector.replication"
            - "--collector.replication_slot"
            - "--collector.stat_bgwriter"
            - "--collector.stat_database"
            - "--collector.stat_statements"
            - "--collector.stat_user_tables"
            - "--collector.statio_user_tables"
            - "--collector.wal"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # 빠른 복구: 문제 감지 5초, 재시작까지 총 10초
          startupProbe:
            httpGet:
              path: /metrics
              port: 9187
            periodSeconds: 2
            failureThreshold: 15
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 1

---
apiVersion: v1
kind: Service
metadata:
  name: ${DEPLOY_NAME}
  namespace: ${TARGET_NAMESPACE}
  labels:
    app: postgresql-exporter
    db-discovery/managed-by: auto-discovery
    db-instance: ${DB_IDENTIFIER}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
    prometheus.io/path: "/metrics"
    db-discovery/db-identifier: "${DB_IDENTIFIER}"
    db-discovery/endpoint: "${DB_ENDPOINT}"
spec:
  type: ClusterIP
  ports:
    - port: 9187
      targetPort: 9187
      protocol: TCP
      name: metrics
  selector:
    app: postgresql-exporter
    db-instance: ${DB_IDENTIFIER}
