# =============================================================================
# MS SQL Exporter 템플릿
# RDS SQL Server 인스턴스 모니터링용
# 환경변수 치환(envsubst)으로 동적 생성됩니다.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${DEPLOY_NAME}
  namespace: ${TARGET_NAMESPACE}
  labels:
    app: mssql-exporter
    db-discovery/managed-by: auto-discovery
    db-discovery/exporter-type: mssql
    db-discovery/source-type: ${SOURCE_TYPE}
  annotations:
    db-discovery/db-identifier: "${DB_IDENTIFIER}"
    db-discovery/endpoint: "${DB_ENDPOINT}"
    db-discovery/port: "${DB_PORT}"
    db-discovery/engine: "sqlserver"
    db-discovery/cluster-id: "${CLUSTER_ID}"
    db-discovery/created-at: "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
spec:
  replicas: 1
  # HA: 업데이트 시에도 기존 Pod 유지 (메트릭 갭 방지)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: mssql-exporter
      db-instance: ${DB_IDENTIFIER}
  template:
    metadata:
      labels:
        app: mssql-exporter
        db-instance: ${DB_IDENTIFIER}
        db-discovery/managed-by: auto-discovery
      annotations:
        # ADOT Collector가 이 Pod을 자동으로 scrape하도록 설정
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      # 빠른 종료 (기본 30초 → 5초)
      terminationGracePeriodSeconds: 5
      # 리소스 부족 시 eviction 방지
      priorityClassName: db-exporter-priority
      # 노드 장애 시 빠른 재스케줄링 (300초 → 10초)
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 10
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 10
      containers:
        - name: mssql-exporter
          image: ${EXPORTER_IMAGE}
          ports:
            - containerPort: 4000
              name: metrics
              protocol: TCP
          env:
            # SQL Server 접속 정보
            - name: SERVER
              value: "${DB_ENDPOINT}"
            - name: PORT
              value: "${DB_PORT}"
            - name: USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${SECRET_NAME}
                  key: username
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${SECRET_NAME}
                  key: password
            - name: DEBUG
              value: "app"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # 빠른 복구: 문제 감지 5초, 재시작까지 총 10초
          startupProbe:
            httpGet:
              path: /metrics
              port: 4000
            periodSeconds: 2
            failureThreshold: 15
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /metrics
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          readinessProbe:
            httpGet:
              path: /metrics
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 1

---
apiVersion: v1
kind: Service
metadata:
  name: ${DEPLOY_NAME}
  namespace: ${TARGET_NAMESPACE}
  labels:
    app: mssql-exporter
    db-discovery/managed-by: auto-discovery
    db-instance: ${DB_IDENTIFIER}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4000"
    prometheus.io/path: "/metrics"
    db-discovery/db-identifier: "${DB_IDENTIFIER}"
    db-discovery/endpoint: "${DB_ENDPOINT}"
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
      name: metrics
  selector:
    app: mssql-exporter
    db-instance: ${DB_IDENTIFIER}
