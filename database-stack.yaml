AWSTemplateFormatVersion: "2010-09-09"
Description: |
  Database Stack for Aurora EKS AMP Monitoring
  This template creates Aurora MySQL and PostgreSQL clusters.

Parameters:
  EnvironmentName:
    Type: String
    Default: aurora-eks-amp-monitoring
    Description: Environment name used for resource naming and tagging

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where Aurora clusters will be created

  DatabaseSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: List of database subnet IDs for Aurora clusters

  PrivateSubnetCidrs:
    Type: List<String>
    Description: List of private subnet CIDR blocks for security group rules

  PublicSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: List of public subnet IDs for bastion host

  KeyPairName:
    Type: String
    Default: bastion-host-keypair
    Description: Name for the EC2 Key Pair to be created for bastion host access

  MySQLMasterUsername:
    Type: String
    Default: admin
    Description: Master username for Aurora MySQL cluster

  MySQLMasterPassword:
    Type: String
    Default: adminadmin
    NoEcho: true
    Description: Master password for Aurora MySQL cluster

  PostgreSQLMasterUsername:
    Type: String
    Default: root
    Description: Master username for Aurora PostgreSQL cluster

  PostgreSQLMasterPassword:
    Type: String
    Default: rootroot
    NoEcho: true
    Description: Master password for Aurora PostgreSQL cluster

  SQLServerMasterUsername:
    Type: String
    Default: admin
    Description: Master username for RDS SQL Server instance

  SQLServerMasterPassword:
    Type: String
    Default: AdminAdmin123!
    NoEcho: true
    Description: Master password for RDS SQL Server instance (must meet complexity requirements)

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  ##############################################################################
  # EC2 Key Pair
  ##############################################################################
  WorkshopKeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Ref KeyPairName
      KeyType: rsa
      KeyFormat: pem
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-keypair

  ##############################################################################
  # Bastion Host Security Group (defined early to avoid circular dependencies)
  ##############################################################################
  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for bastion host
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH access from anywhere
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: All outbound traffic
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-bastion-sg

  ##############################################################################
  # Aurora MySQL
  ##############################################################################
  MySQLDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for Aurora MySQL cluster
      SubnetIds: !Ref DatabaseSubnets
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-mysql-subnet-group

  MySQLSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Aurora MySQL cluster
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: !Select [0, !Ref PrivateSubnetCidrs]
          Description: Access from private subnet 1
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: !Select [1, !Ref PrivateSubnetCidrs]
          Description: Access from private subnet 2
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: !Select [2, !Ref PrivateSubnetCidrs]
          Description: Access from private subnet 3
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref BastionSecurityGroup
          Description: Access from bastion host
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-mysql-sg

  MySQLCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-mysql
      EngineVersion: 8.0.mysql_aurora.3.04.1
      DatabaseName: aurora_mysql_db
      MasterUsername: !Ref MySQLMasterUsername
      MasterUserPassword: !Ref MySQLMasterPassword
      DBSubnetGroupName: !Ref MySQLDBSubnetGroup
      Port: 3306  # Explicitly set MySQL to use standard port 3306
      BackupRetentionPeriod: 7
      DeletionProtection: false
      VpcSecurityGroupIds:
        - !Ref MySQLSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-aurora-mysql

  MySQLInstance1:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: aurora-mysql
      DBClusterIdentifier: !Ref MySQLCluster
      DBInstanceClass: db.r5.large
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-aurora-mysql-1

  MySQLInstance2:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: aurora-mysql
      DBClusterIdentifier: !Ref MySQLCluster
      DBInstanceClass: db.r5.large
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-aurora-mysql-2

  ##############################################################################
  # Aurora PostgreSQL
  ##############################################################################
  PostgreSQLDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for Aurora PostgreSQL cluster
      SubnetIds: !Ref DatabaseSubnets
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-postgresql-subnet-group

  PostgreSQLSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Aurora PostgreSQL cluster
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Select [0, !Ref PrivateSubnetCidrs]
          Description: Access from private subnet 1
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Select [1, !Ref PrivateSubnetCidrs]
          Description: Access from private subnet 2
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Select [2, !Ref PrivateSubnetCidrs]
          Description: Access from private subnet 3
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref BastionSecurityGroup
          Description: Access from bastion host
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-postgresql-sg

  PostgreSQLCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      EngineVersion: 15.3
      DatabaseName: aurora_postgresql_db
      MasterUsername: !Ref PostgreSQLMasterUsername
      MasterUserPassword: !Ref PostgreSQLMasterPassword
      DBSubnetGroupName: !Ref PostgreSQLDBSubnetGroup
      Port: 5432  # Explicitly set PostgreSQL to use standard port 5432
      BackupRetentionPeriod: 7
      DeletionProtection: false
      VpcSecurityGroupIds:
        - !Ref PostgreSQLSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-aurora-postgresql

  PostgreSQLInstance1:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: aurora-postgresql
      DBClusterIdentifier: !Ref PostgreSQLCluster
      DBInstanceClass: db.r5.large
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-aurora-postgresql-1

  PostgreSQLInstance2:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: aurora-postgresql
      DBClusterIdentifier: !Ref PostgreSQLCluster
      DBInstanceClass: db.r5.large
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-aurora-postgresql-2

  ##############################################################################
  # RDS SQL Server
  ##############################################################################
  SQLServerDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for RDS SQL Server instance
      SubnetIds: !Ref DatabaseSubnets
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-sqlserver-subnet-group

  SQLServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS SQL Server instance
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 1433
          ToPort: 1433
          CidrIp: !Select [0, !Ref PrivateSubnetCidrs]
          Description: Access from private subnet 1
        - IpProtocol: tcp
          FromPort: 1433
          ToPort: 1433
          CidrIp: !Select [1, !Ref PrivateSubnetCidrs]
          Description: Access from private subnet 2
        - IpProtocol: tcp
          FromPort: 1433
          ToPort: 1433
          CidrIp: !Select [2, !Ref PrivateSubnetCidrs]
          Description: Access from private subnet 3
        - IpProtocol: tcp
          FromPort: 1433
          ToPort: 1433
          SourceSecurityGroupId: !Ref BastionSecurityGroup
          Description: Access from bastion host
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-sqlserver-sg

  SQLServerInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: sqlserver-se  # Changed to Standard Edition for Read Replica support
      EngineVersion: 15.00.4236.7.v1
      DBInstanceClass: db.m5.large  # Standard Edition requires larger instance class
      LicenseModel: license-included  # Required for SQL Server Standard Edition
      AllocatedStorage: 20
      StorageType: gp2
      MasterUsername: !Ref SQLServerMasterUsername
      MasterUserPassword: !Ref SQLServerMasterPassword
      DBSubnetGroupName: !Ref SQLServerDBSubnetGroup
      VPCSecurityGroups:
        - !Ref SQLServerSecurityGroup
      Port: 1433
      BackupRetentionPeriod: 7
      MultiAZ: true
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-sqlserver

  ##############################################################################
  # Bastion Host
  ##############################################################################
  BastionHost:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId # Amazon Linux 2023 AMI (update for your region)
      InstanceType: t2.micro
      KeyName: !Ref WorkshopKeyPair
      SubnetId: !Select [0, !Ref PublicSubnets]
      SecurityGroupIds:
        - !Ref BastionSecurityGroup
      IamInstanceProfile: !Ref BastionInstanceProfile
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          sudo dnf update -y

          # Install MySQL client
          sudo dnf install -y mariadb105

          # Install PostgreSQL client
          sudo dnf install -y postgresql15

          # Install SQL Server client tools
          curl https://packages.microsoft.com/config/rhel/8/prod.repo | sudo tee /etc/yum.repos.d/msprod.repo
          sudo dnf install -y mssql-tools18 unixODBC-devel
          echo 'export PATH="$PATH:/opt/mssql-tools18/bin"' >> ~/.bash_profile
          source ~/.bash_profile

          # Install performance testing tools
          sudo dnf install -y git python3 python3-pip htop iotop

          # Install MySQL sysbench
          echo "=== Installing dependencies for sysbench build ==="
          sudo dnf groupinstall -y "Development Tools"
          sudo dnf install -y git automake libtool pkgconfig make gcc-c++ \
              mariadb-connector-c-devel libaio-devel \
              readline-devel libcurl-devel wget

          echo "=== Cloning sysbench repository ==="
          cd /tmp
          if [ -d sysbench ]; then
              sudo rm -rf sysbench
          fi
          git clone https://github.com/akopytov/sysbench.git
          cd sysbench

          echo "=== Building sysbench ==="
          ./autogen.sh
          ./configure
          make -j$(nproc)
          sudo make install

          echo "=== Verifying sysbench installation ==="
          sysbench --version
          echo "=== sysbench installation completed ==="

          # Install pgbench (PostgreSQL benchmark tool)
          sudo dnf install -y postgresql15 postgresql15-contrib

          # Create performance test scripts directory
          mkdir -p /home/ec2-user/performance-tests
          chown ec2-user:ec2-user /home/ec2-user/performance-tests

          # Create MySQL performance test script
          cat > /home/ec2-user/performance-tests/mysql-test.sh << 'EOF'
          #!/bin/bash

          # MySQL Performance Test Script
          MYSQL_HOST=${MySQLCluster.Endpoint.Address}
          MYSQL_USER=${MySQLMasterUsername}
          MYSQL_PASS=${MySQLMasterPassword}
          MYSQL_DB=aurora_mysql_db

          echo "Starting MySQL Performance Test..."
          echo "MySQL Host: $MYSQL_HOST"

          # Test connection
          mysql -h $MYSQL_HOST -u $MYSQL_USER -p$MYSQL_PASS -e "SELECT VERSION();" $MYSQL_DB

          # Prepare test data
          sysbench oltp_read_write \
            --mysql-host=$MYSQL_HOST \
            --mysql-user=$MYSQL_USER \
            --mysql-password=$MYSQL_PASS \
            --mysql-db=$MYSQL_DB \
            --tables=4 \
            --table-size=100000 \
            prepare

          # Run performance test
          echo "Running MySQL performance test for 300 seconds..."
          sysbench oltp_read_write \
            --mysql-host=$MYSQL_HOST \
            --mysql-user=$MYSQL_USER \
            --mysql-password=$MYSQL_PASS \
            --mysql-db=$MYSQL_DB \
            --tables=4 \
            --table-size=100000 \
            --threads=16 \
            --time=300 \
            --report-interval=10 \
            run

          # Cleanup
          sysbench oltp_read_write \
            --mysql-host=$MYSQL_HOST \
            --mysql-user=$MYSQL_USER \
            --mysql-password=$MYSQL_PASS \
            --mysql-db=$MYSQL_DB \
            --tables=4 \
            cleanup

          echo "MySQL Performance Test Completed!"
          EOF

          # Create SQL Server performance test script
          cat > /home/ec2-user/performance-tests/sqlserver-test.sh << 'EOF'
          #!/bin/bash

          # SQL Server Performance Test Script
          SQLSERVER_HOST=${SQLServerInstance.Endpoint.Address}
          SQLSERVER_USER=${SQLServerMasterUsername}
          SQLSERVER_PASS=${SQLServerMasterPassword}
          SQLSERVER_DB=master

          echo "Starting SQL Server Performance Test..."
          echo "SQL Server Host: $SQLSERVER_HOST"

          # Test connection
          /opt/mssql-tools18/bin/sqlcmd -S $SQLSERVER_HOST -U $SQLSERVER_USER -P $SQLSERVER_PASS -C -Q "SELECT @@VERSION"

          # Create test database and table
          /opt/mssql-tools18/bin/sqlcmd -S $SQLSERVER_HOST -U $SQLSERVER_USER -P $SQLSERVER_PASS -C -Q "
          IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = 'TestDB')
          BEGIN
              CREATE DATABASE TestDB;
          END
          "

          /opt/mssql-tools18/bin/sqlcmd -S $SQLSERVER_HOST -U $SQLSERVER_USER -P $SQLSERVER_PASS -d TestDB -C -Q "
          IF NOT EXISTS (SELECT * FROM sysobjects WHERE name='TestTable' AND xtype='U')
          BEGIN
              CREATE TABLE TestTable (
                  ID int IDENTITY(1,1) PRIMARY KEY,
                  Name nvarchar(50),
                  Value int,
                  CreatedDate datetime DEFAULT GETDATE()
              );
          END
          "

          # Insert test data
          echo "Inserting test data..."
          for i in {1..1000}; do
              /opt/mssql-tools18/bin/sqlcmd -S $SQLSERVER_HOST -U $SQLSERVER_USER -P $SQLSERVER_PASS -d TestDB -C -Q "
              INSERT INTO TestTable (Name, Value) VALUES ('Test$i', $i);
              " > /dev/null 2>&1
          done

          # Run performance test queries
          echo "Running SQL Server performance test..."
          for i in {1..100}; do
              /opt/mssql-tools18/bin/sqlcmd -S $SQLSERVER_HOST -U $SQLSERVER_USER -P $SQLSERVER_PASS -d TestDB -C -Q "
              SELECT COUNT(*) FROM TestTable WHERE Value > RAND() * 1000;
              UPDATE TestTable SET Value = Value + 1 WHERE ID = $((RANDOM % 1000 + 1));
              " > /dev/null 2>&1
              if [ $((i % 10)) -eq 0 ]; then
                  echo "Completed $i/100 test iterations"
              fi
          done

          echo "SQL Server Performance Test Completed!"
          EOF

          # Create PostgreSQL performance test script
          cat > /home/ec2-user/performance-tests/postgresql-test.sh << 'EOF'
          #!/bin/bash

          # PostgreSQL Performance Test Script
          PG_HOST=${PostgreSQLCluster.Endpoint.Address}
          PG_USER=${PostgreSQLMasterUsername}
          PG_PASS=${PostgreSQLMasterPassword}
          PG_DB=aurora_postgresql_db

          export PGPASSWORD=$PG_PASS

          echo "Starting PostgreSQL Performance Test..."
          echo "PostgreSQL Host: $PG_HOST"

          # Test connection
          psql -h $PG_HOST -U $PG_USER -d $PG_DB -c "SELECT version();"

          # Initialize pgbench database
          pgbench -h $PG_HOST -U $PG_USER -d $PG_DB -i -s 100

          # Run performance test
          echo "Running PostgreSQL performance test for 300 seconds..."
          pgbench -h $PG_HOST -U $PG_USER -d $PG_DB \
            -c 16 \
            -j 4 \
            -T 300 \
            -P 10 \
            -r

          echo "PostgreSQL Performance Test Completed!"
          EOF

          # Make scripts executable
          chmod +x /home/ec2-user/performance-tests/*.sh
          chown ec2-user:ec2-user /home/ec2-user/performance-tests/*.sh

          # Create a combined test script
          cat > /home/ec2-user/performance-tests/run-all-tests.sh << 'EOF'
          #!/bin/bash

          echo "=== Starting Database Performance Tests ==="
          echo "Timestamp: $(date)"

          echo ""
          echo "=== MySQL Performance Test ==="
          /home/ec2-user/performance-tests/mysql-test.sh

          echo ""
          echo "=== Waiting 60 seconds before PostgreSQL test ==="
          sleep 60

          echo ""
          echo "=== PostgreSQL Performance Test ==="
          /home/ec2-user/performance-tests/postgresql-test.sh

          echo ""
          echo "=== Waiting 60 seconds before SQL Server test ==="
          sleep 60

          echo ""
          echo "=== SQL Server Performance Test ==="
          /home/ec2-user/performance-tests/sqlserver-test.sh

          echo ""
          echo "=== All Performance Tests Completed ==="
          echo "Timestamp: $(date)"
          EOF

          chmod +x /home/ec2-user/performance-tests/run-all-tests.sh
          chown ec2-user:ec2-user /home/ec2-user/performance-tests/run-all-tests.sh

          # Create README for the user
          cat > /home/ec2-user/performance-tests/README.md << 'EOF'
          # Database Performance Testing Scripts

          This directory contains scripts to test the performance of Aurora MySQL and PostgreSQL clusters.

          ## Available Scripts:

          1. **mysql-test.sh** - Tests MySQL performance using sysbench
          2. **postgresql-test.sh** - Tests PostgreSQL performance using pgbench
          3. **sqlserver-test.sh** - Tests SQL Server performance using custom queries
          4. **run-all-tests.sh** - Runs all tests sequentially

          ## Usage:

          ```bash
          # Run individual tests
          ./mysql-test.sh
          ./postgresql-test.sh
          ./sqlserver-test.sh

          # Run all tests
          ./run-all-tests.sh
          ```

          ## Test Details:

          - **MySQL Test**: Uses sysbench with OLTP read/write workload, 4 tables, 100K rows each, 16 threads, 5 minutes
          - **PostgreSQL Test**: Uses pgbench with default workload, scale factor 100, 16 clients, 4 jobs, 5 minutes
          - **SQL Server Test**: Uses custom queries with INSERT/SELECT/UPDATE operations, 1000 rows, 100 iterations

          ## Monitoring:

          While tests are running, you can monitor the metrics in Grafana dashboards to see the impact on database performance.
          EOF

          chown ec2-user:ec2-user /home/ec2-user/performance-tests/README.md
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-bastion-host

  BastionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-bastion-role

  BastionInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref BastionRole

Outputs:
  MySQLClusterEndpoint:
    Description: The endpoint for the Aurora MySQL cluster
    Value: !GetAtt MySQLCluster.Endpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-MySQLClusterEndpoint

  MySQLClusterPort:
    Description: The port for the Aurora MySQL cluster
    Value: 3306
    Export:
      Name: !Sub ${AWS::StackName}-MySQLClusterPort

  MySQLInstance1Endpoint:
    Description: The endpoint for Aurora MySQL instance 1
    Value: !GetAtt MySQLInstance1.Endpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-MySQLInstance1Endpoint

  MySQLInstance2Endpoint:
    Description: The endpoint for Aurora MySQL instance 2
    Value: !GetAtt MySQLInstance2.Endpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-MySQLInstance2Endpoint

  PostgreSQLClusterEndpoint:
    Description: The endpoint for the Aurora PostgreSQL cluster
    Value: !GetAtt PostgreSQLCluster.Endpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-PostgreSQLClusterEndpoint

  PostgreSQLClusterPort:
    Description: The port for the Aurora PostgreSQL cluster
    Value: 5432
    Export:
      Name: !Sub ${AWS::StackName}-PostgreSQLClusterPort

  PostgreSQLInstance1Endpoint:
    Description: The endpoint for Aurora PostgreSQL instance 1
    Value: !GetAtt PostgreSQLInstance1.Endpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-PostgreSQLInstance1Endpoint

  PostgreSQLInstance2Endpoint:
    Description: The endpoint for Aurora PostgreSQL instance 2
    Value: !GetAtt PostgreSQLInstance2.Endpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-PostgreSQLInstance2Endpoint

  BastionHostInstanceId:
    Description: Instance ID of the bastion host
    Value: !Ref BastionHost
    Export:
      Name: !Sub ${AWS::StackName}-BastionHostInstanceId

  BastionHostPublicIP:
    Description: Public IP address of the bastion host
    Value: !GetAtt BastionHost.PublicIp
    Export:
      Name: !Sub ${AWS::StackName}-BastionHostPublicIP

  BastionHostPrivateIP:
    Description: Private IP address of the bastion host
    Value: !GetAtt BastionHost.PrivateIp
    Export:
      Name: !Sub ${AWS::StackName}-BastionHostPrivateIP

  KeyPairId:
    Description: ID of the created EC2 Key Pair
    Value: !Ref WorkshopKeyPair
    Export:
      Name: !Sub ${AWS::StackName}-KeyPairId

  KeyPairName:
    Description: Name of the created EC2 Key Pair
    Value: !Ref KeyPairName
    Export:
      Name: !Sub ${AWS::StackName}-KeyPairName

  SQLServerInstanceEndpoint:
    Description: The endpoint for the RDS SQL Server instance
    Value: !GetAtt SQLServerInstance.Endpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-SQLServerReplicaEndpoint

  SQLServerInstancePort:
    Description: The port for the RDS SQL Server instances
    Value: 1433
    Export:
      Name: !Sub ${AWS::StackName}-SQLServerInstancePort
