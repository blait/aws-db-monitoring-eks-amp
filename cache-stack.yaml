AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Cache Stack for ElastiCache Valkey
  This template creates an ElastiCache Valkey Replication Group.

Parameters:
  EnvironmentName:
    Type: String
    Default: integrated-db-monitoring
    Description: Environment name used for resource naming and tagging

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where ElastiCache cluster will be created (from networking-stack output)

  DatabaseSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: List of database subnet IDs for ElastiCache cluster (from networking-stack output)

  PrivateSubnetCidrs:
    Type: List<String>
    Description: List of private subnet CIDR blocks for security group rules (from networking-stack output)

Resources:
  ##############################################################################
  # ElastiCache Valkey
  ##############################################################################
  ElastiCacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Subnet group for ElastiCache Valkey cluster
      SubnetIds: !Ref DatabaseSubnets
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-elasticache-subnet-group

  ElastiCacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ElastiCache Valkey cluster
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # 모든 private subnet CIDR에서 Valkey 포트 6379로의 접근 허용
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          CidrIp: 10.0.0.0/16  # VPC CIDR 전체 허용 (더 안전하게 하려면 EKS 노드 보안 그룹 참조)
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-elasticache-sg

  ElastiCacheReplicationGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupId: !Sub ${EnvironmentName}-valkey
      ReplicationGroupDescription: Valkey cluster for workshop
      Engine: valkey
      EngineVersion: "7.2"
      CacheNodeType: cache.r7g.large # 워크숍용으로 작은 타입 사용, 필요시 변경
      ClusterMode: "enabled"
      NumNodeGroups: 1 # 샤드 수
      ReplicasPerNodeGroup: 1 # 각 샤드당 복제본 수
      AutomaticFailoverEnabled: true
      AutoMinorVersionUpgrade: true
      SecurityGroupIds:
        - !Ref ElastiCacheSecurityGroup
      CacheSubnetGroupName: !Ref ElastiCacheSubnetGroup
      Port: 6379
      SnapshotRetentionLimit: 7
      TransitEncryptionEnabled: false # 모니터링 호환성을 위해 비활성화
      AtRestEncryptionEnabled: true # 저장 시 암호화는 유지
      MultiAZEnabled: true # 다중 AZ 배포
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-valkey

Outputs:
  ElastiCacheRedisEndpoint:
    Description: The configuration endpoint for the ElastiCache Valkey cluster
    Value: !GetAtt ElastiCacheReplicationGroup.ConfigurationEndPoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-ElastiCacheRedisEndpoint

  ElastiCacheRedisPort:
    Description: The port for the ElastiCache Valkey cluster
    Value: !GetAtt ElastiCacheReplicationGroup.ConfigurationEndPoint.Port
    Export:
      Name: !Sub ${AWS::StackName}-ElastiCacheRedisPort