AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ElastiCache Valkey (Redis-compatible) CloudFormation Stack
  Multi-AZ replication group for high availability.

# ==============================================================================
# Parameters
# ==============================================================================
Parameters:
  EnvironmentName:
    Description: 'Environment name prefix'
    Type: String
    Default: integrated-db-monitoring

  VpcId:
    Description: VPC ID for ElastiCache deployment
    Type: AWS::EC2::VPC::Id

  DatabaseSubnets:
    Description: Database subnet IDs (comma-separated)
    Type: CommaDelimitedList

  PrivateSubnetCidrs:
    Description: Private subnet CIDRs (comma-separated, for inbound rules)
    Type: CommaDelimitedList

# ==============================================================================
# Resources
# ==============================================================================
Resources:
  # ----------------------------------------------------------------------------
  # ElastiCache Subnet Group
  # ----------------------------------------------------------------------------
  ElastiCacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      CacheSubnetGroupName: !Sub '${EnvironmentName}-valkey-subnet-group'
      Description: !Sub '${EnvironmentName} Valkey cache subnet group'
      SubnetIds: !Ref DatabaseSubnets

  # ----------------------------------------------------------------------------
  # Security Group - Allow port 6379 from private subnets
  # ----------------------------------------------------------------------------
  ElastiCacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${EnvironmentName}-valkey-sg'
      GroupDescription: !Sub '${EnvironmentName} Valkey cache security group - port 6379 from private subnets'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # Inbound from private subnet AZ1
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          CidrIp: !Select [0, !Ref PrivateSubnetCidrs]
          Description: Allow Valkey access from private subnet AZ1
        # Inbound from private subnet AZ2
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          CidrIp: !Select [1, !Ref PrivateSubnetCidrs]
          Description: Allow Valkey access from private subnet AZ2
        # Inbound from private subnet AZ3
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          CidrIp: !Select [2, !Ref PrivateSubnetCidrs]
          Description: Allow Valkey access from private subnet AZ3
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-valkey-sg'
        - Key: Environment
          Value: !Ref EnvironmentName

  # ----------------------------------------------------------------------------
  # ElastiCache Replication Group - Valkey engine, Multi-AZ
  # ----------------------------------------------------------------------------
  ElastiCacheReplicationGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupId: !Sub '${EnvironmentName}-valkey-cluster'
      ReplicationGroupDescription: !Sub '${EnvironmentName} Valkey cache replication group (Multi-AZ)'
      Engine: valkey
      EngineVersion: '7.2'
      CacheNodeType: cache.t4g.medium
      NumCacheClusters: 2
      MultiAZEnabled: true
      AutomaticFailoverEnabled: true
      CacheSubnetGroupName: !Ref ElastiCacheSubnetGroup
      SecurityGroupIds:
        - !GetAtt ElastiCacheSecurityGroup.GroupId
      Port: 6379
      # Maintenance and backup settings
      PreferredMaintenanceWindow: sun:05:00-sun:06:00
      SnapshotRetentionLimit: 7
      SnapshotWindow: 03:00-04:00
      # Enable in-transit encryption
      TransitEncryptionEnabled: true
      AtRestEncryptionEnabled: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-valkey-cluster'
        - Key: Environment
          Value: !Ref EnvironmentName

# ==============================================================================
# Outputs
# ==============================================================================
Outputs:
  ElastiCacheRedisEndpoint:
    Description: Valkey (Redis-compatible) Primary endpoint address
    Value: !GetAtt ElastiCacheReplicationGroup.PrimaryEndPoint.Address
    Export:
      Name: !Sub '${EnvironmentName}-ElastiCacheRedisEndpoint'

  ElastiCacheRedisPort:
    Description: Valkey (Redis-compatible) Primary endpoint port
    Value: !GetAtt ElastiCacheReplicationGroup.PrimaryEndPoint.Port
    Export:
      Name: !Sub '${EnvironmentName}-ElastiCacheRedisPort'