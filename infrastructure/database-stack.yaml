AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Integrated DB Monitoring - Database Infrastructure Stack
  Aurora MySQL (Writer + Reader x2), Aurora PostgreSQL (Writer + Reader x2), 
  RDS SQL Server - matches architecture diagram

Parameters:
  EnvironmentName:
    Type: String
    Default: integrated-db-monitoring
    Description: Environment name for resource tagging
  
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID
  
  DatabaseSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Database subnet list
  
  PrivateSubnetCidrs:
    Type: CommaDelimitedList
    Description: Private subnet CIDR list (for security group inbound rules)
  
  PublicSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnet list
  
  # Aurora MySQL Settings
  MySQLMasterUsername:
    Type: String
    Default: admin
    Description: Aurora MySQL master username
  
  MySQLMasterPassword:
    Type: String
    Default: AdminAdmin123!
    NoEcho: true
    Description: Aurora MySQL master password
  
  # Aurora PostgreSQL Settings
  PostgreSQLMasterUsername:
    Type: String
    Default: postgres
    Description: Aurora PostgreSQL master username
  
  PostgreSQLMasterPassword:
    Type: String
    Default: AdminAdmin123!
    NoEcho: true
    Description: Aurora PostgreSQL master password
  
  # SQL Server Settings
  SQLServerMasterUsername:
    Type: String
    Default: admin
    Description: SQL Server master username
  
  SQLServerMasterPassword:
    Type: String
    Default: AdminAdmin123!
    NoEcho: true
    Description: SQL Server master password

Resources:
  #############################################
  # Security Groups
  #############################################
  
  # Aurora MySQL Security Group
  MySQLSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurora MySQL cluster security group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: !Select [0, !Ref PrivateSubnetCidrs]
          Description: Allow MySQL access from Private Subnet 1
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: !Select [1, !Ref PrivateSubnetCidrs]
          Description: Allow MySQL access from Private Subnet 2
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: !Select [2, !Ref PrivateSubnetCidrs]
          Description: Allow MySQL access from Private Subnet 3
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-mysql-sg"
  
  # Aurora PostgreSQL Security Group
  PostgreSQLSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurora PostgreSQL cluster security group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Select [0, !Ref PrivateSubnetCidrs]
          Description: Allow PostgreSQL access from Private Subnet 1
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Select [1, !Ref PrivateSubnetCidrs]
          Description: Allow PostgreSQL access from Private Subnet 2
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Select [2, !Ref PrivateSubnetCidrs]
          Description: Allow PostgreSQL access from Private Subnet 3
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-postgresql-sg"
  
  # SQL Server Security Group
  SQLServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS SQL Server security group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 1433
          ToPort: 1433
          CidrIp: !Select [0, !Ref PrivateSubnetCidrs]
          Description: Allow SQL Server access from Private Subnet 1
        - IpProtocol: tcp
          FromPort: 1433
          ToPort: 1433
          CidrIp: !Select [1, !Ref PrivateSubnetCidrs]
          Description: Allow SQL Server access from Private Subnet 2
        - IpProtocol: tcp
          FromPort: 1433
          ToPort: 1433
          CidrIp: !Select [2, !Ref PrivateSubnetCidrs]
          Description: Allow SQL Server access from Private Subnet 3
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-sqlserver-sg"

  #############################################
  # DB Subnet Group
  #############################################
  
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Database subnet group for monitoring workshop
      SubnetIds: !Ref DatabaseSubnets
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-db-subnet-group"

  #############################################
  # Aurora MySQL Cluster
  #############################################
  
  MySQLCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      DBClusterIdentifier: !Sub "${EnvironmentName}-mysql-cluster"
      Engine: aurora-mysql
      EngineVersion: "8.0.mysql_aurora.3.05.2"
      MasterUsername: !Ref MySQLMasterUsername
      MasterUserPassword: !Ref MySQLMasterPassword
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VpcSecurityGroupIds:
        - !Ref MySQLSecurityGroup
      StorageEncrypted: true
      BackupRetentionPeriod: 7
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-mysql-cluster"
        - Key: Engine
          Value: aurora-mysql
  
  # MySQL Writer Instance
  MySQLInstance1:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${EnvironmentName}-mysql-writer"
      DBClusterIdentifier: !Ref MySQLCluster
      DBInstanceClass: db.r6g.large
      Engine: aurora-mysql
      PromotionTier: 0
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-mysql-writer"
        - Key: Role
          Value: writer
  
  # MySQL Reader Instance 1
  MySQLInstance2:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${EnvironmentName}-mysql-reader-1"
      DBClusterIdentifier: !Ref MySQLCluster
      DBInstanceClass: db.r6g.large
      Engine: aurora-mysql
      PromotionTier: 1
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-mysql-reader-1"
        - Key: Role
          Value: reader
  
  # MySQL Reader Instance 2 (added to match architecture)
  MySQLInstance3:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${EnvironmentName}-mysql-reader-2"
      DBClusterIdentifier: !Ref MySQLCluster
      DBInstanceClass: db.r6g.large
      Engine: aurora-mysql
      PromotionTier: 2
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-mysql-reader-2"
        - Key: Role
          Value: reader

  #############################################
  # Aurora PostgreSQL Cluster
  #############################################
  
  PostgreSQLCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      DBClusterIdentifier: !Sub "${EnvironmentName}-postgresql-cluster"
      Engine: aurora-postgresql
      EngineVersion: "15.4"
      MasterUsername: !Ref PostgreSQLMasterUsername
      MasterUserPassword: !Ref PostgreSQLMasterPassword
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VpcSecurityGroupIds:
        - !Ref PostgreSQLSecurityGroup
      StorageEncrypted: true
      BackupRetentionPeriod: 7
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-postgresql-cluster"
        - Key: Engine
          Value: aurora-postgresql
  
  # PostgreSQL Writer Instance
  PostgreSQLInstance1:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${EnvironmentName}-postgresql-writer"
      DBClusterIdentifier: !Ref PostgreSQLCluster
      DBInstanceClass: db.r6g.large
      Engine: aurora-postgresql
      PromotionTier: 0
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-postgresql-writer"
        - Key: Role
          Value: writer
  
  # PostgreSQL Reader Instance 1
  PostgreSQLInstance2:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${EnvironmentName}-postgresql-reader-1"
      DBClusterIdentifier: !Ref PostgreSQLCluster
      DBInstanceClass: db.r6g.large
      Engine: aurora-postgresql
      PromotionTier: 1
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-postgresql-reader-1"
        - Key: Role
          Value: reader
  
  # PostgreSQL Reader Instance 2 (added to match architecture)
  PostgreSQLInstance3:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${EnvironmentName}-postgresql-reader-2"
      DBClusterIdentifier: !Ref PostgreSQLCluster
      DBInstanceClass: db.r6g.large
      Engine: aurora-postgresql
      PromotionTier: 2
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-postgresql-reader-2"
        - Key: Role
          Value: reader

  #############################################
  # RDS SQL Server
  #############################################
  
  SQLServerInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${EnvironmentName}-sqlserver"
      Engine: sqlserver-ex
      EngineVersion: "16.00.4165.4.v1"
      DBInstanceClass: db.t3.xlarge
      MasterUsername: !Ref SQLServerMasterUsername
      MasterUserPassword: !Ref SQLServerMasterPassword
      AllocatedStorage: 100
      StorageType: gp3
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VpcSecurityGroupIds:
        - !Ref SQLServerSecurityGroup
      MultiAZ: false
      LicenseModel: license-included
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-sqlserver"
        - Key: Engine
          Value: sqlserver

  #############################################
  # Secrets Manager (for Exporter authentication)
  #############################################
  
  MySQLMonitoringSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${EnvironmentName}/mysql/monitoring"
      Description: MySQL Exporter monitoring account credentials
      SecretString: !Sub |
        {
          "username": "exporter",
          "password": "ExporterPass123!",
          "engine": "mysql",
          "host": "${MySQLCluster.Endpoint.Address}",
          "port": 3306
        }
  
  PostgreSQLMonitoringSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${EnvironmentName}/postgresql/monitoring"
      Description: PostgreSQL Exporter monitoring account credentials
      SecretString: !Sub |
        {
          "username": "exporter",
          "password": "ExporterPass123!",
          "engine": "postgresql",
          "host": "${PostgreSQLCluster.Endpoint.Address}",
          "port": 5432
        }
  
  SQLServerMonitoringSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${EnvironmentName}/sqlserver/monitoring"
      Description: SQL Server Exporter monitoring account credentials
      SecretString: !Sub |
        {
          "username": "exporter",
          "password": "ExporterPass123!",
          "engine": "sqlserver",
          "host": "${SQLServerInstance.Endpoint.Address}",
          "port": 1433
        }

Outputs:
  # Aurora MySQL Endpoints
  MySQLClusterEndpoint:
    Description: Aurora MySQL cluster endpoint (Writer)
    Value: !GetAtt MySQLCluster.Endpoint.Address
    Export:
      Name: !Sub "${EnvironmentName}-mysql-cluster-endpoint"
  
  MySQLClusterReaderEndpoint:
    Description: Aurora MySQL reader endpoint
    Value: !GetAtt MySQLCluster.ReadEndpoint.Address
    Export:
      Name: !Sub "${EnvironmentName}-mysql-reader-endpoint"
  
  MySQLInstance1Endpoint:
    Description: Aurora MySQL Writer instance endpoint
    Value: !GetAtt MySQLInstance1.Endpoint.Address
  
  MySQLInstance2Endpoint:
    Description: Aurora MySQL Reader 1 instance endpoint
    Value: !GetAtt MySQLInstance2.Endpoint.Address
  
  MySQLInstance3Endpoint:
    Description: Aurora MySQL Reader 2 instance endpoint
    Value: !GetAtt MySQLInstance3.Endpoint.Address
  
  # Aurora PostgreSQL Endpoints
  PostgreSQLClusterEndpoint:
    Description: Aurora PostgreSQL cluster endpoint (Writer)
    Value: !GetAtt PostgreSQLCluster.Endpoint.Address
    Export:
      Name: !Sub "${EnvironmentName}-postgresql-cluster-endpoint"
  
  PostgreSQLClusterReaderEndpoint:
    Description: Aurora PostgreSQL reader endpoint
    Value: !GetAtt PostgreSQLCluster.ReadEndpoint.Address
    Export:
      Name: !Sub "${EnvironmentName}-postgresql-reader-endpoint"
  
  PostgreSQLInstance1Endpoint:
    Description: Aurora PostgreSQL Writer instance endpoint
    Value: !GetAtt PostgreSQLInstance1.Endpoint.Address
  
  PostgreSQLInstance2Endpoint:
    Description: Aurora PostgreSQL Reader 1 instance endpoint
    Value: !GetAtt PostgreSQLInstance2.Endpoint.Address
  
  PostgreSQLInstance3Endpoint:
    Description: Aurora PostgreSQL Reader 2 instance endpoint
    Value: !GetAtt PostgreSQLInstance3.Endpoint.Address
  
  # SQL Server Endpoint
  SQLServerInstanceEndpoint:
    Description: RDS SQL Server instance endpoint
    Value: !GetAtt SQLServerInstance.Endpoint.Address
    Export:
      Name: !Sub "${EnvironmentName}-sqlserver-endpoint"
  
  # Security Groups
  MySQLSecurityGroupId:
    Description: MySQL security group ID
    Value: !Ref MySQLSecurityGroup
  
  PostgreSQLSecurityGroupId:
    Description: PostgreSQL security group ID
    Value: !Ref PostgreSQLSecurityGroup
  
  SQLServerSecurityGroupId:
    Description: SQL Server security group ID
    Value: !Ref SQLServerSecurityGroup
