# ==============================================================================
# eksctl ClusterConfig - envsubst template
# Usage: envsubst < eks-cluster.yaml | eksctl create cluster -f -
#
# Required environment variables:
#   CLUSTER_NAME       - EKS cluster name
#   AWS_REGION         - AWS region (e.g. ap-northeast-2)
#   EKS_VERSION        - EKS version (e.g. 1.31)
#   VPC_ID             - Existing VPC ID
#   PRIVATE_SUBNET_1   - Private subnet 1 ID (AZ-a)
#   PRIVATE_SUBNET_2   - Private subnet 2 ID (AZ-b)
#   PRIVATE_SUBNET_3   - Private subnet 3 ID (AZ-c)
# ==============================================================================
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

# Cluster metadata
metadata:
  name: ${CLUSTER_NAME}
  region: ${AWS_REGION}
  version: "1.31"

# Use existing VPC and private subnets
vpc:
  id: ${VPC_ID}
  subnets:
    private:
      # AZ-a private subnet
      private-az1:
        id: ${PRIVATE_SUBNET_1}
      # AZ-b private subnet
      private-az2:
        id: ${PRIVATE_SUBNET_2}
      # AZ-c private subnet
      private-az3:
        id: ${PRIVATE_SUBNET_3}

# IAM - enable OIDC provider (for IRSA)
iam:
  withOIDC: true

# Managed node group for monitoring workloads
managedNodeGroups:
  - name: monitoring-ng
    instanceType: m5.large
    desiredCapacity: 3
    minSize: 2
    maxSize: 5
    # Run nodes in private subnets only (security)
    privateNetworking: true
    # Volume settings
    volumeSize: 80
    volumeType: gp3
    # IAM addon policies
    iam:
      withAddonPolicies:
        # For CloudWatch logs and metrics
        cloudWatch: true
        # Policy for ALB Ingress Controller
        albIngress: true
    # Node labels
    labels:
      role: monitoring
      environment: production
    # Node tags
    tags:
      nodegroup-role: monitoring

# EKS Addons - core networking and storage
addons:
  # VPC CNI - Pod networking (VPC native IP assignment)
  - name: vpc-cni
    resolveConflicts: overwrite
  # CoreDNS - Cluster internal DNS
  - name: coredns
    resolveConflicts: overwrite
  # kube-proxy - Service networking (iptables/IPVS rules)
  - name: kube-proxy
    resolveConflicts: overwrite
  # EBS CSI Driver - Persistent volume provisioning
  - name: aws-ebs-csi-driver
    resolveConflicts: overwrite
