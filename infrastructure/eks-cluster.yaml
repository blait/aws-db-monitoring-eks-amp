# ==============================================================================
# eksctl ClusterConfig — envsubst 템플릿
# 사용법: envsubst < eks-cluster.yaml | eksctl create cluster -f -
#
# 필요한 환경변수:
#   CLUSTER_NAME       - EKS 클러스터 이름
#   AWS_REGION         - AWS 리전 (예: ap-northeast-2)
#   EKS_VERSION        - EKS 버전 (예: 1.29)
#   VPC_ID             - 기존 VPC ID
#   PRIVATE_SUBNET_1   - 프라이빗 서브넷 1 ID (AZ-a)
#   PRIVATE_SUBNET_2   - 프라이빗 서브넷 2 ID (AZ-b)
#   PRIVATE_SUBNET_3   - 프라이빗 서브넷 3 ID (AZ-c)
# ==============================================================================
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

# 클러스터 메타데이터
metadata:
  name: ${CLUSTER_NAME}
  region: ${AWS_REGION}
  version: "${EKS_VERSION}"

# 기존 VPC 및 프라이빗 서브넷 사용 설정
vpc:
  id: ${VPC_ID}
  subnets:
    private:
      # AZ-a 프라이빗 서브넷
      private-az1:
        id: ${PRIVATE_SUBNET_1}
      # AZ-b 프라이빗 서브넷
      private-az2:
        id: ${PRIVATE_SUBNET_2}
      # AZ-c 프라이빗 서브넷
      private-az3:
        id: ${PRIVATE_SUBNET_3}

# IAM 설정 — OIDC 프로바이더 활성화 (IRSA용)
iam:
  withOIDC: true

# 관리형 노드 그룹 — 모니터링 워크로드용
managedNodeGroups:
  - name: monitoring-ng
    instanceType: m5.large
    desiredCapacity: 3
    minSize: 2
    maxSize: 5
    # 프라이빗 서브넷에서만 노드 실행 (보안 강화)
    privateNetworking: true
    # 볼륨 설정
    volumeSize: 80
    volumeType: gp3
    # IAM 애드온 정책
    iam:
      withAddonPolicies:
        # CloudWatch 로그 및 메트릭 전송용
        cloudWatch: true
        # ALB Ingress Controller 사용을 위한 정책
        albIngress: true
    # 노드 레이블
    labels:
      role: monitoring
      environment: production
    # 노드 태그
    tags:
      nodegroup-role: monitoring

# EKS 애드온 — 핵심 네트워킹 및 스토리지 컴포넌트
addons:
  # VPC CNI — 파드 네트워킹 (VPC 네이티브 IP 할당)
  - name: vpc-cni
    resolveConflicts: overwrite
  # CoreDNS — 클러스터 내부 DNS 서비스
  - name: coredns
    resolveConflicts: overwrite
  # kube-proxy — 서비스 네트워킹 (iptables/IPVS 규칙 관리)
  - name: kube-proxy
    resolveConflicts: overwrite
  # EBS CSI Driver — 영구 볼륨 프로비저닝
  - name: aws-ebs-csi-driver
    resolveConflicts: overwrite
