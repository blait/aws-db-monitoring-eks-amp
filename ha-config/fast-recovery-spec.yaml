# =============================================================================
# Exporter Pod 빠른 복구 설정 패치 (Kustomize overlay 형태)
# =============================================================================
# 
# 이 파일은 auto-discovery 스크립트가 생성하는 모든 Exporter Deployment에
# 자동으로 적용되는 강화된 복구 설정입니다.
#
# db-discovery-updated.sh에서 Exporter 생성 시 이 설정을 주입합니다.
#
# 💰 추가 비용: $0 (기존 Pod 설정 변경만)
# ⏱️ 복구 시간: 기존 30~60초 → 5~15초로 단축
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# [적용 방법] 각 Exporter 템플릿에 아래 설정을 추가/수정합니다
# ─────────────────────────────────────────────────────────────────────────────

# 1. Deployment spec 수정사항
# ─────────────────────────────────────
# spec:
#   replicas: 1                          ← 비용 절약: 1개만 유지
#   revisionHistoryLimit: 3
#   strategy:
#     type: RollingUpdate
#     rollingUpdate:
#       maxUnavailable: 0                ← 업데이트 시에도 항상 기존 Pod 유지
#       maxSurge: 1

# 2. Container 복구 설정 (빠른 감지 + 빠른 재시작)
# ─────────────────────────────────────
# containers:
#   - name: ...
#     # 빠른 재시작 정책
#     restartPolicy: Always
#     
#     # Liveness Probe 강화: 문제 감지 5초 + 재시작까지 총 10초
#     livenessProbe:
#       httpGet:
#         path: /metrics          # 또는 /health
#         port: <exporter-port>
#       initialDelaySeconds: 10   # 첫 시작 후 10초 대기
#       periodSeconds: 5          # 5초마다 체크 (기존 15초 → 5초)
#       timeoutSeconds: 3         # 응답 대기 3초
#       failureThreshold: 2      # 2번 실패 시 재시작 (기존 3번 → 2번)
#       successThreshold: 1
#     
#     # Readiness Probe: 트래픽 차단 빠르게
#     readinessProbe:
#       httpGet:
#         path: /metrics
#         port: <exporter-port>
#       initialDelaySeconds: 5    # 5초 후 확인
#       periodSeconds: 5          # 5초마다 체크
#       timeoutSeconds: 3
#       failureThreshold: 1      # 1번 실패 즉시 트래픽 차단
#       successThreshold: 1
#     
#     # Startup Probe: 초기 시작 보호 (cold start 시 liveness가 먼저 kill하지 않도록)
#     startupProbe:
#       httpGet:
#         path: /metrics
#         port: <exporter-port>
#       initialDelaySeconds: 0
#       periodSeconds: 2          # 2초마다 체크
#       failureThreshold: 15     # 최대 30초 대기 (2초 × 15)
#       successThreshold: 1

# 3. Pod 레벨 설정
# ─────────────────────────────────────
# spec:
#   template:
#     spec:
#       # 빠른 종료 (기본 30초 → 5초)
#       terminationGracePeriodSeconds: 5
#       
#       # 높은 우선순위: 리소스 부족 시 eviction 방지
#       priorityClassName: db-exporter-priority
#       
#       # 노드 장애 시 빠른 재스케줄링
#       tolerations:
#         - key: "node.kubernetes.io/not-ready"
#           operator: "Exists"
#           effect: "NoExecute"
#           tolerationSeconds: 10   # 노드 NotReady 후 10초 내 재배치 (기존 300초)
#         - key: "node.kubernetes.io/unreachable"
#           operator: "Exists"
#           effect: "NoExecute"
#           tolerationSeconds: 10

# =============================================================================
# [결과 시나리오별 복구 시간]
# =============================================================================
#
# ┌────────────────────────────────┬────────────────┬────────────────────────┐
# │ 장애 시나리오                  │ 기존 (복구시간) │ 개선 후 (복구시간)     │
# ├────────────────────────────────┼────────────────┼────────────────────────┤
# │ Exporter 프로세스 크래시       │ 30~60초        │ 5~10초                 │
# │ Exporter OOM Kill             │ 30~60초        │ 5~10초                 │
# │ 네트워크 일시 장애             │ 45~90초        │ 10~15초                │
# │ 노드 장애 (NotReady)          │ 5~6분          │ 10~30초                │
# │ 클러스터 업그레이드 (drain)    │ PDB 보호       │ PDB 보호 (갭 없음)     │
# │ ADOT Collector 1개 다운       │ 전체 수집 중단 │ 다른 Collector가 인수   │
# └────────────────────────────────┴────────────────┴────────────────────────┘
#
# 💡 최대 메트릭 갭: 약 10~15초 (scrape_interval 30초 기준, 최대 1개 데이터포인트 손실)
#    vs replicas:2 방식: 갭 0초이지만 비용 2배 + AMP 저장 비용 증가
# =============================================================================
