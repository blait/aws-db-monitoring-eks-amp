# =============================================================================
# Prometheus-based Collector Values (replaces ADOT)
# =============================================================================
# Note: During testing, ADOT Collector Helm chart had multiple compatibility
# issues. We use prometheus-community/prometheus as the collector instead.
# This values file is kept as reference for ADOT-specific configuration.
#
# RECOMMENDED: Use prometheus-community/prometheus Helm chart directly:
#   helm install prometheus prometheus-community/prometheus \
#     --namespace observability \
#     --set server.remoteWrite[0].url="AMP_ENDPOINT" \
#     --set server.remoteWrite[0].sigv4.region=ap-northeast-2 \
#     --set serviceAccounts.server.annotations."eks\.amazonaws\.com/role-arn"="ROLE_ARN" \
#     --set server.persistentVolume.enabled=false \
#     --set alertmanager.enabled=false \
#     --set kube-state-metrics.enabled=false \
#     --set prometheus-node-exporter.enabled=false \
#     --set prometheus-pushgateway.enabled=false
# =============================================================================
# Below is the ADOT-compatible config (for reference / future use when chart is stable)

mode: deployment
replicaCount: 2

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.102.0"

serviceAccount:
  create: true
  name: adot-collector

config:
  extensions:
    health_check:
      endpoint: 0.0.0.0:13133
    sigv4auth:
      region: "ap-northeast-2"
      service: "aps"
  receivers:
    prometheus:
      config:
        scrape_configs:
          - job_name: kubernetes-pods
            scrape_interval: 30s
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names:
                    - observability
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                action: keep
                regex: "true"
  processors:
    batch:
      send_batch_size: 1024
      timeout: 5s
    memory_limiter:
      limit_mib: 512
      spike_limit_mib: 128
      check_interval: 5s
  exporters:
    prometheusremotewrite:
      endpoint: "PLACEHOLDER"
      auth:
        authenticator: sigv4auth
  service:
    extensions:
      - health_check
      - sigv4auth
    pipelines:
      metrics:
        receivers:
          - prometheus
        processors:
          - memory_limiter
          - batch
        exporters:
          - prometheusremotewrite

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi
