# =============================================================================
# MSSQL Exporter Service
# =============================================================================
# ClusterIP 타입 — 클러스터 내부에서만 접근 (ADOT가 스크래핑)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mssql-exporter.fullname" . }}
  labels:
    {{- include "mssql-exporter.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: metrics
  selector:
    {{- include "mssql-exporter.selectorLabels" . | nindent 4 }}
