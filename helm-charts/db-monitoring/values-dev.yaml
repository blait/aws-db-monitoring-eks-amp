# Development environment values
global:
  namespace: observability
  region: us-east-1
  clusterName: ""
  rbac:
    create: true

# Amazon Managed Prometheus configuration
amp:
  workspaceId: ""
  endpoint: ""
  region: us-east-1

# ADOT Collector configuration - values passed to subchart
adot-collector:
  enabled: true
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: ""
  resources:
    requests:
      cpu: 250m
      memory: 500Mi
    limits:
      cpu: 500m
      memory: 1Gi
  amp:
    endpoint: ""
    region: us-east-1

# MySQL Exporter configuration - values passed to subchart
mysql-exporter:
  enabled: true
  instances:
    - name: mysql-instance-1
      endpoint: ""
      port: 3306
      username: admin
      password: adminadmin
      enabled: true
    - name: mysql-instance-2
      endpoint: ""
      port: 3306
      username: admin
      password: adminadmin
      enabled: true

# PostgreSQL Exporter configuration - values passed to subchart
postgresql-exporter:
  enabled: true
  instances:
    - name: postgresql-instance-1
      endpoint: ""
      port: 5432
      username: root
      password: rootroot
      database: postgres
      sslmode: disable
      enabled: true
    - name: postgresql-instance-2
      endpoint: ""
      port: 5432
      username: root
      password: rootroot
      database: postgres
      sslmode: disable
      enabled: true

# redis-exporter configuration
redis-exporter:
  enabled: true
  instances:
    - name: elasticache-valkey-cluster # 이 이름은 redis-exporter/values.yaml의 인스턴스 이름과 일치해야 합니다.
      endpoint: "" # deploy-monitoring.sh 스크립트가 VALKEY_ENDPOINT로 채울 부분입니다.
      port: 6379 # Valkey 기본 포트
  image:
    repository: oliver006/redis_exporter
    tag: v1.65.0 # 사용하고자 하는 버전 (redis-exporter/Chart.yaml의 appVersion과 일치)
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 9121
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9121"

