# Global configuration
global:
  namespace: observability
  region: us-east-1
  clusterName: ""
  
# Amazon Managed Prometheus configuration
amp:
  workspaceId: ""
  endpoint: ""
  region: ""

# ADOT Collector configuration
adot:
  enabled: true
  image:
    repository: public.ecr.aws/aws-observability/aws-otel-collector
    tag: v0.40.0
    pullPolicy: IfNotPresent
  
  serviceAccount:
    create: true
    name: adot-collector
    annotations: {}
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/adot-collector-role
  
  resources:
    requests:
      cpu: 250m
      memory: 500Mi
    limits:
      cpu: 500m
      memory: 1Gi
  
  config:
    scrapeInterval: 30s
    scrapeTimeout: 10s
    logLevel: info
  
  nodeSelector: {}
  tolerations: []
  affinity: {}

# MySQL Exporter configuration
mysql:
  enabled: true
  instances:
    - name: mysql-instance-1
      endpoint: ""
      port: 3306
      username: admin
      password: adminadmin
      enabled: true
    - name: mysql-instance-2
      endpoint: ""
      port: 3306
      username: admin
      password: adminadmin
      enabled: true
  
  image:
    repository: prom/mysqld-exporter
    tag: v0.15.1
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  
  service:
    type: ClusterIP
    port: 9104
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9104"
  
  # MySQL exporter specific flags
  collectors:
    info_schema_tables: true
    info_schema_innodb_metrics: true
    global_status: true
    global_variables: true
    slave_status: true
    info_schema_processlist: true
    info_schema_query_response_time: true
    info_schema_replica_host: true
    info_schema_tablestats: true
    info_schema_schemastats: true
    info_schema_userstats: true
    perf_schema_eventsstatements: true
    perf_schema_file_events: true
    perf_schema_indexiowaits: true
    perf_schema_tableiowaits: true
    perf_schema_tablelocks: true

# PostgreSQL Exporter configuration
postgresql:
  enabled: true
  instances:
    - name: postgresql-instance-1
      endpoint: ""
      port: 5432
      username: root
      password: rootroot
      database: postgres
      sslmode: disable
      enabled: true
    - name: postgresql-instance-2
      endpoint: ""
      port: 5432
      username: root
      password: rootroot
      database: postgres
      sslmode: disable
      enabled: true
  
  image:
    repository: quay.io/prometheuscommunity/postgres-exporter
    tag: v0.15.0
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  
  service:
    type: ClusterIP
    port: 9187
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
  
  # PostgreSQL exporter configuration
  config:
    autoDiscoverDatabases: true
    excludeDatabases: []
    includeDatabases: []
    constantLabels: {}

# Monitoring and observability settings
monitoring:
  serviceMonitor:
    enabled: false
    namespace: observability
    interval: 30s
    scrapeTimeout: 10s
  
  prometheusRule:
    enabled: false
    namespace: observability

# Security settings
security:
  podSecurityPolicy:
    enabled: false
  
  networkPolicy:
    enabled: false
  
  rbac:
    create: true
