# CloudWatch integration for AWS infrastructure metrics only
cloudwatch:
  enabled: true
  region: ${AWS_REGION}
  
# Performance Insights integration - now via AMP
performanceInsights:
  enabled: true
  # Collected via pi-exporter to AMP instead of Lambda to CloudWatch
  useAMP: true
  rbac:
    create: true
  networkPolicy:
    enabled: true
