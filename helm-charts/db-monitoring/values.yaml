# Production environment values
global:
  namespace: observability
  region: ${AWS_REGION}
  clusterName: ""
  rbac:
    create: true

# Amazon Managed Prometheus configuration
amp:
  workspaceId: ""
  endpoint: ""
  region: ${AWS_REGION}

# ADOT Collector configuration - values passed to subchart
adot-collector:
  enabled: true
  serviceAccount:
    create: true
    name: adot-collector
    annotations:
      eks.amazonaws.com/role-arn: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  config:
    scrapeInterval: 15s
    scrapeTimeout: 10s
  amp:
    endpoint: ""
    region: ${AWS_REGION}

# MySQL Exporter configuration - monitor primary instance (represents cluster)
mysql-exporter:
  enabled: true
  instances:
    - name: mysql-cluster
      endpoint: ""  # Will be set to primary MySQL endpoint (instance-1)
      port: 3306
      username: admin
      password: adminadmin
      enabled: true
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# PostgreSQL Exporter configuration - monitor cluster writer for enterprise metrics
postgresql-exporter:
  enabled: true
  instances:
    - name: postgresql-cluster
      endpoint: ""  # Will be set to PostgreSQL cluster writer endpoint
      port: 5432
      username: root
      password: rootroot
      database: postgres
      sslmode: disable
      enabled: true
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# SQL Server Exporter configuration
sql-exporter:
  enabled: true
  endpoint: ""  # Will be set to SQL Server endpoint
  port: 1433
  username: admin
  password: AdminAdmin123!
  image:
    repository: burningalchemist/sql_exporter
    tag: 0.18.2
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# redis-exporter configuration
redis-exporter:
  enabled: true
  instances:
    - name: elasticache-valkey-cluster
      endpoint: ""
      port: ""
      enabled: true
  image:
    repository: oliver006/redis_exporter
    tag: v1.65.0 # 사용하고자 하는 버전 (redis-exporter/Chart.yaml의 appVersion과 일치)
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 9121
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9121"

