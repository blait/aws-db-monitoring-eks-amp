# Production environment values
global:
  namespace: observability
  region: ""
  clusterName: ""
  rbac:
    create: true

# Amazon Managed Prometheus configuration
amp:
  workspaceId: ""
  endpoint: ""
  region: ""

# Aurora Discovery configuration - automatic Aurora cluster discovery and monitoring
aurora-discovery:
  enabled: true # Enabled by default - primary Aurora monitoring system
  schedule: "0 * * * *" # Every hour
  image:
    repository: ""
    tag: "latest"
    pullPolicy: Always
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  aws:
    region: ""
  serviceAccount:
    create: true
    name: aurora-discovery
    annotations:
      eks.amazonaws.com/role-arn: "" # Must be set to IAM role ARN with required permissions
  state:
    configMapName: aurora-discovery-state
  logging:
    level: INFO
  cronJob:
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 1
    restartPolicy: OnFailure
    backoffLimit: 2

# ADOT Collector configuration - values passed to subchart
adot-collector:
  enabled: true
  serviceAccount:
    create: true
    name: adot-collector
    annotations:
      eks.amazonaws.com/role-arn: "" # Must be set to IAM role ARN with AMP write permissions
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  config:
    scrapeInterval: 15s
    scrapeTimeout: 10s
  amp:
    endpoint: "" # Must be set to AMP workspace endpoint (e.g., https://aps-workspaces.ap-northeast-2.amazonaws.com/workspaces/ws-xxx/api/v1/remote_write)
    region: ""
  auroraDiscovery:
    enabled: true # Enable Aurora Discovery integration (disable legacy static configs)

# redis-exporter configuration - for ElastiCache/Redis monitoring (separate from Aurora)
redis-exporter:
  enabled: true
  instances:
    - name: elasticache-valkey-cluster
      endpoint: ""
      port: ""
      enabled: true
  image:
    repository: oliver006/redis_exporter
    tag: v1.65.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 9121
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9121"

# SQL Server Exporter configuration - for SQL Server monitoring (separate from Aurora)
sql-exporter:
  enabled: true
  endpoint: "" # Will be set to SQL Server endpoint
  port: 1433
  username: admin
  password: AdminAdmin123!
  image:
    repository: burningalchemist/sql_exporter
    tag: 0.18.2
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
# Legacy MySQL and PostgreSQL static exporters removed
# Aurora Discovery now handles Aurora MySQL and PostgreSQL cluster monitoring dynamically
