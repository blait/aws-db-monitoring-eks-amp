#Default values for redis-exporter
replicaCount: 1 #exporter pod 개수

instances:
  - name: elasticache-valkey-cluster
    endpoint: ""
    port: 6379
    password: ""
    enabled: true
    redis_cluster_client_metrics: true

image:
  repository: oliver006/redis_exporter
  tag: v1.65.0
  pullPolicy: IfNotPresent

serviceAccount:
  create: false
  name: ""
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

service:
  type: ClusterIP
  port: 9121
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9121"

nodeSelector: {}
tolerations: []
affinity: {}
