{{- range .Values.instances }}
  {{- if .enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  # Deployment 이름은 각 인스턴스의 이름(예: elasticache-valkey-cluster)을 사용하여 고유하게 만듭니다.
  # Kubernetes DNS-1035 규칙을 따르도록 소문자, 하이픈으로 변환하고 끝의 하이픈을 제거합니다.
  name: {{ .name | lower | replace "_" "-" | trunc 63 | trimSuffix "-" }}
  namespace: {{ $.Release.Namespace }} # Helm 릴리즈의 네임스페이스를 사용합니다.
  labels:
    {{- include "redis-exporter.labels" $ | nindent 4 }}
    app.kubernetes.io/instance: {{ .name | lower | replace "_" "-" }} # 인스턴스 이름으로 레이블 설정
    app.kubernetes.io/component: {{ .name | lower | replace "_" "-" }} # 인스턴스 이름으로 컴포넌트 설정
spec:
  replicas: 1 # .Values.replicaCount (values.yaml의 최상위 replicaCount)를 참조할 수도 있습니다.
  # 현재는 각 인스턴스별로 1개의 Exporter Pod를 배포합니다.
  selector:
    matchLabels:
      {{- include "redis-exporter.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/instance: {{ .name | lower | replace "_" "-" }} # 셀렉터가 POD의 레이블과 일치해야 합니다.
      app.kubernetes.io/component: {{ .name | lower | replace "_" "-" }} # 컴포넌트 레이블과 일치
  template:
    metadata:
      labels:
        {{- include "redis-exporter.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/instance: {{ .name | lower | replace "_" "-" }}
        app.kubernetes.io/component: {{ .name | lower | replace "_" "-" }}
    spec:
      containers:
        - name: redis-exporter
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["/redis_exporter"] # redis_exporter 실행 명령어
          args:
            # Redis Exporter의 연결 주소를 인스턴스별로 설정합니다.
            # .endpoint는 values-prod.yaml의 redis-exporter.instances.endpoint를 참조합니다.
            - "--redis.addr={{ .endpoint }}:{{ .port }}"
            # ElastiCache Valkey 클러스터는 클러스터 모드로 동작하므로 이 플래그를 활성화합니다.
            - "--is-cluster" # Valkey 클러스터 지표 수집에 중요!
            # Exporter가 지표를 노출할 주소와 경로
            - "--web.listen-address=:{{ $.Values.service.port }}"
            - "--web.telemetry-path=/metrics"
            # 필요에 따라 추가 exporter 옵션을 여기에 추가할 수 있습니다.
            # 예: - "--check-keys=db0=mykey_*"
          # 비밀번호가 없으므로, env 섹션은 제거합니다.
          ports:
            - name: http-metrics
              containerPort: {{ $.Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /metrics
              port: http-metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: http-metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- end }}
  {{- end }}