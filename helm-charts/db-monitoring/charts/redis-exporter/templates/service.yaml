{{- range .Values.instances }}
{{- if .enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name | lower | replace "_" "-" | trunc 63 | trimSuffix "-" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "redis-exporter.labels" $ | nindent 4 }}
    app.kubernetes.io/instance: {{ .name | lower | replace "_" "-" }}
    app.kubernetes.io/component: {{ .name | lower | replace "_" "-" }}
  annotations:
    {{- toYaml $.Values.service.annotations | nindent 4 }}
spec:
  type: {{ $.Values.service.type }}
  ports:
    - port: {{ $.Values.service.port }}
      targetPort: http-metrics
      protocol: TCP
      name: http-metrics
  selector:
    {{- include "redis-exporter.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/instance: {{ .name | lower | replace "_" "-" }}
    app.kubernetes.io/component: {{ .name | lower | replace "_" "-" }}
{{- end }}
{{- end }}