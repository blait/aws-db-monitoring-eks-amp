{{- range .Values.instances }}
{{- if .enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.global.namespace | default "observability" }}
  labels:
    {{- include "mysql-exporter.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ .name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mysql-exporter.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ .name }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
      labels:
        {{- include "mysql-exporter.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ .name }}
    spec:
      containers:
      - name: mysql-exporter
        image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        command: ["/bin/mysqld_exporter"]
        args:
        {{- if $.Values.collectors.info_schema_tables }}
        - --collect.info_schema.tables
        {{- end }}
        {{- if $.Values.collectors.info_schema_innodb_metrics }}
        - --collect.info_schema.innodb_metrics
        {{- end }}
        {{- if $.Values.collectors.global_status }}
        - --collect.global_status
        {{- end }}
        {{- if $.Values.collectors.global_variables }}
        - --collect.global_variables
        {{- end }}
        {{- if $.Values.collectors.slave_status }}
        - --collect.slave_status
        {{- end }}
        {{- if $.Values.collectors.info_schema_processlist }}
        - --collect.info_schema.processlist
        {{- end }}
        {{- if $.Values.collectors.info_schema_query_response_time }}
        - --collect.info_schema.query_response_time
        {{- end }}
        {{- if $.Values.collectors.info_schema_replica_host }}
        - --collect.info_schema.replica_host
        {{- end }}
        {{- if $.Values.collectors.info_schema_tablestats }}
        - --collect.info_schema.tablestats
        {{- end }}
        {{- if $.Values.collectors.info_schema_schemastats }}
        - --collect.info_schema.schemastats
        {{- end }}
        {{- if $.Values.collectors.info_schema_userstats }}
        - --collect.info_schema.userstats
        {{- end }}
        {{- if $.Values.collectors.perf_schema_eventsstatements }}
        - --collect.perf_schema.eventsstatements
        {{- end }}
        {{- if $.Values.collectors.perf_schema_file_events }}
        - --collect.perf_schema.file_events
        {{- end }}
        {{- if $.Values.collectors.perf_schema_indexiowaits }}
        - --collect.perf_schema.indexiowaits
        {{- end }}
        {{- if $.Values.collectors.perf_schema_tableiowaits }}
        - --collect.perf_schema.tableiowaits
        {{- end }}
        {{- if $.Values.collectors.perf_schema_tablelocks }}
        - --collect.perf_schema.tablelocks
        {{- end }}
        ports:
        - name: metrics
          containerPort: 9104
          protocol: TCP
        env:
        - name: DATA_SOURCE_NAME
          valueFrom:
            secretKeyRef:
              name: {{ include "mysql-exporter.fullname" $ }}-{{ .name }}
              key: data-source-name
        - name: MYSQLD_EXPORTER_WEB_LISTEN_ADDRESS
          value: "0.0.0.0:9104"
        - name: MYSQLD_EXPORTER_WEB_TELEMETRY_PATH
          value: "/metrics"
        resources:
          {{- toYaml $.Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
