{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sql-exporter.fullname" . }}-config
  labels:
    {{- include "sql-exporter.labels" . | nindent 4 }}
data:
  config.yml: |
    global:
      scrape_timeout: 10s
      min_interval: 0s
      max_connections: 1
      max_idle_connections: 1
    
    target:
      data_source_name: 'sqlserver://{{ .Values.username }}:{{ .Values.password }}@{{ .Values.endpoint }}:{{ .Values.port }}?database=master'
      collectors: [mssql_standard]
    
    collectors:
    - collector_name: mssql_standard
      metrics:
      - metric_name: mssql_up
        type: gauge
        help: 'Server up'
        values: ["up"]
        query: |
          SELECT 1 as up
      
      - metric_name: mssql_connections
        type: gauge
        help: 'Number of active connections'
        values: ["connections"]
        query: |
          SELECT 
            COUNT(*) as connections
          FROM sys.dm_exec_sessions 
          WHERE is_user_process = 1
      
      - metric_name: mssql_product_version
        type: gauge
        help: 'Instance version (Major.Minor)'
        values: ["version"]
        query: |
          SELECT CAST(SERVERPROPERTY('ProductMajorVersion') AS FLOAT) + CAST(SERVERPROPERTY('ProductMinorVersion') AS FLOAT) / 100 as version
      
      - metric_name: mssql_instance_local_time
        type: gauge
        help: 'Number of seconds since epoch on local instance'
        values: ["local_time"]
        query: |
          SELECT DATEDIFF(SECOND, '1970-01-01', GETDATE()) as local_time
      
      - metric_name: mssql_connections_by_database
        type: gauge
        help: 'Number of active connections by database'
        key_labels: ["db_name", "state"]
        values: ["connections"]
        query: |
          SELECT 
            ISNULL(DB_NAME(database_id), 'master') as db_name,
            status as state,
            COUNT(*) as connections
          FROM sys.dm_exec_sessions 
          WHERE is_user_process = 1
          GROUP BY database_id, status
      
      - metric_name: mssql_deadlocks
        type: counter
        help: 'Number of lock requests per second that resulted in a deadlock since last restart'
        values: ["deadlocks"]
        query: |
          SELECT cntr_value as deadlocks
          FROM sys.dm_os_performance_counters 
          WHERE counter_name = 'Number of Deadlocks/sec' AND instance_name = '_Total'
      
      - metric_name: mssql_user_errors
        type: counter
        help: 'Number of user errors/sec since last restart'
        values: ["user_errors"]
        query: |
          SELECT cntr_value as user_errors
          FROM sys.dm_os_performance_counters 
          WHERE counter_name = 'Errors/sec' AND instance_name = 'User Errors'
      
      - metric_name: mssql_database_state
        type: gauge
        help: 'Database states: 0=ONLINE 1=RESTORING 2=RECOVERING 3=RECOVERY_PENDING 4=SUSPECT 5=EMERGENCY 6=OFFLINE 7=COPYING 10=OFFLINE_SECONDARY'
        key_labels: ["db_name"]
        values: ["state"]
        query: |
          SELECT 
            name as db_name,
            state as state
          FROM sys.databases
      
      - metric_name: mssql_log_growths
        type: counter
        help: 'Total number of times the transaction log for the database has been expanded since last restart'
        key_labels: ["db_name"]
        values: ["log_growths"]
        query: |
          SELECT 
            instance_name as db_name,
            cntr_value as log_growths
          FROM sys.dm_os_performance_counters 
          WHERE counter_name = 'Log Growths' AND instance_name != '_Total'
      
      - metric_name: mssql_page_reads
        type: counter
        help: 'Page reads/sec'
        values: ["page_reads"]
        query: |
          SELECT cntr_value as page_reads
          FROM sys.dm_os_performance_counters 
          WHERE counter_name = 'Page reads/sec'
      
      - metric_name: mssql_page_writes
        type: counter
        help: 'Page writes/sec'
        values: ["page_writes"]
        query: |
          SELECT cntr_value as page_writes
          FROM sys.dm_os_performance_counters 
          WHERE counter_name = 'Page writes/sec'
      
      - metric_name: mssql_page_life_expectancy
        type: gauge
        help: 'Indicates the minimum number of seconds a page will stay in the buffer pool'
        key_labels: ["instance"]
        values: ["page_life_expectancy"]
        query: |
          SELECT 
            ISNULL(instance_name, 'default') as instance,
            cntr_value as page_life_expectancy
          FROM sys.dm_os_performance_counters 
          WHERE counter_name = 'Page life expectancy'
      
      - metric_name: mssql_lazy_writes
        type: counter
        help: 'Lazy writes/sec'
        values: ["lazy_writes"]
        query: |
          SELECT cntr_value as lazy_writes
          FROM sys.dm_os_performance_counters 
          WHERE counter_name = 'Lazy writes/sec'
      
      - metric_name: mssql_checkpoint_pages
        type: counter
        help: 'Checkpoint pages/sec'
        values: ["checkpoint_pages"]
        query: |
          SELECT cntr_value as checkpoint_pages
          FROM sys.dm_os_performance_counters 
          WHERE counter_name = 'Checkpoint pages/sec'
      
      - metric_name: mssql_batch_requests
        type: counter
        help: 'Number of Transact-SQL command batches received per second'
        values: ["batch_requests"]
        query: |
          SELECT cntr_value as batch_requests
          FROM sys.dm_os_performance_counters 
          WHERE counter_name = 'Batch Requests/sec'
      
      - metric_name: mssql_transactions
        type: counter
        help: 'Number of transactions started for the database per second'
        key_labels: ["db_name"]
        values: ["transactions"]
        query: |
          SELECT 
            instance_name as db_name,
            cntr_value as transactions
          FROM sys.dm_os_performance_counters 
          WHERE counter_name = 'Transactions/sec' AND instance_name != '_Total'
      
      - metric_name: mssql_page_fault_count
        type: counter
        help: 'Number of page faults since last restart'
        values: ["page_faults"]
        query: |
          SELECT page_fault_count as page_faults
          FROM sys.dm_os_process_memory
      
      - metric_name: mssql_memory_utilization_percentage
        type: gauge
        help: 'Percentage of memory utilization'
        values: ["memory_utilization"]
        query: |
          SELECT memory_utilization_percentage as memory_utilization
          FROM sys.dm_os_process_memory
      
      - metric_name: mssql_total_physical_memory_kb
        type: gauge
        help: 'Total physical memory in KB'
        values: ["total_physical_memory"]
        query: |
          SELECT total_physical_memory_kb as total_physical_memory
          FROM sys.dm_os_sys_memory
      
      - metric_name: mssql_available_physical_memory_kb
        type: gauge
        help: 'Available physical memory in KB'
        values: ["available_physical_memory"]
        query: |
          SELECT available_physical_memory_kb as available_physical_memory
          FROM sys.dm_os_sys_memory
      
      - metric_name: mssql_client_connections
        type: gauge
        help: 'Number of active client connections'
        key_labels: ["client", "db_name"]
        values: ["connections"]
        query: |
          SELECT 
            ISNULL(client_net_address, 'unknown') as client,
            ISNULL(DB_NAME(database_id), 'master') as db_name,
            COUNT(*) as connections
          FROM sys.dm_exec_sessions 
          WHERE is_user_process = 1
          GROUP BY client_net_address, database_id
      
      - metric_name: mssql_kill_connection_errors
        type: counter
        help: 'Number of kill connection errors/sec since last restart'
        values: ["kill_errors"]
        query: |
          SELECT cntr_value as kill_errors
          FROM sys.dm_os_performance_counters 
          WHERE counter_name = 'Kill Connection Errors/sec'
      
      - metric_name: mssql_database_filesize
        type: gauge
        help: 'Physical sizes of files used by database in KB'
        key_labels: ["db_name", "logical_name", "type", "filename"]
        values: ["size_kb"]
        query: |
          SELECT 
            DB_NAME(database_id) as db_name,
            name as logical_name,
            type as type,
            physical_name as filename,
            size * 8 as size_kb
          FROM sys.master_files
      
      - metric_name: mssql_io_stall
        type: counter
        help: 'Wait time (ms) of stall since last restart'
        key_labels: ["db_name", "type"]
        values: ["io_stall_ms"]
        query: |
          SELECT 
            DB_NAME(database_id) as db_name,
            CASE 
              WHEN type = 0 THEN 'data'
              WHEN type = 1 THEN 'log'
              ELSE 'unknown'
            END as type,
            io_stall as io_stall_ms
          FROM sys.dm_io_virtual_file_stats(NULL, NULL)
{{- end }}
