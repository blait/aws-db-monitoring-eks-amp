{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sql-exporter
  labels:
    {{- include "sql-exporter.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "sql-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sql-exporter.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9399"
    spec:
      containers:
      - name: sql-exporter
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 9399
          name: metrics
        args:
        - "-config.file=/config/config.yml"
        volumeMounts:
        - name: config
          mountPath: /config
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: {{ include "sql-exporter.fullname" . }}-config
{{- end }}
