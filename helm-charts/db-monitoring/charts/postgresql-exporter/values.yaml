# Enterprise PostgreSQL Exporter Configuration
instances:
  - name: postgresql-cluster
    endpoint: ""  # Will be set to primary PostgreSQL endpoint (cluster writer)
    port: 5432
    username: root
    password: rootroot
    database: postgres
    sslmode: disable
    enabled: true

image:
  repository: quay.io/prometheuscommunity/postgres-exporter
  tag: v0.15.0
  pullPolicy: IfNotPresent

# Enhanced resource allocation for enterprise monitoring
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

service:
  type: ClusterIP
  port: 9187
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
    prometheus.io/path: "/metrics"

# PostgreSQL exporter configuration
config:
  # Enable auto-discovery of databases
  autoDiscoverDatabases: true
  
  # Exclude system databases from monitoring
  excludeDatabases: 
    - template0
    - template1
    - rdsadmin
  
  # Include specific databases (empty = all discovered)
  includeDatabases: []
  
  # Enable custom queries for enterprise metrics
  customQueries: false
  
  # Disable problematic collectors for Aurora
  disableCollectors:
    - wal
    - replication
  
  # Enhanced metric collection settings
  collectors:
    # Enable standard collectors that work with Aurora
    pg_stat_database: true
    pg_stat_user_tables: true
    pg_stat_user_indexes: true
    pg_statio_user_tables: true
    pg_statio_user_indexes: true
    pg_stat_activity: true
    pg_stat_bgwriter: true
    pg_stat_archiver: true
    pg_locks: true
    
    # Disable problematic collectors
    pg_stat_replication: false
    pg_stat_wal_receiver: false
    
  # Performance and reliability settings
  scraping:
    # Increase timeout for complex queries
    timeout: 30s
    # Scrape interval (controlled by Prometheus)
    interval: 15s
    # Maximum connections to database
    max_connections: 3
    # Connection timeout
    connect_timeout: 10s
    
  # Query execution settings
  query_settings:
    # Maximum execution time for custom queries
    max_query_time: 20s
    # Enable query logging for debugging
    log_queries: false
    # Disable settings metrics to reduce overhead
    disable_settings_metrics: false

# Node scheduling
nodeSelector: {}
tolerations: []
affinity: {}

# Additional labels and annotations
labels: {}
annotations: {}

# Environment variables for fine-tuning
env:
  # Disable problematic collectors
  PG_EXPORTER_DISABLE_DEFAULT_METRICS: "false"
  PG_EXPORTER_DISABLE_SETTINGS_METRICS: "false"
  # Enable extended metrics
  PG_EXPORTER_EXTEND_QUERY_PATH: "/etc/postgres_exporter/queries.yaml"
  # Connection pool settings
  PG_EXPORTER_MAX_IDLE_CONNS: "3"
  PG_EXPORTER_MAX_OPEN_CONNS: "3"
  # Query timeout
  PG_EXPORTER_QUERY_TIMEOUT: "20"
