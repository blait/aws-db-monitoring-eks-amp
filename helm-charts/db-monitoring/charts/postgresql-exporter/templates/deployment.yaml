{{- range .Values.instances }}
{{- if .enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.global.namespace | default "observability" }}
  labels:
    {{- include "postgresql-exporter.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ .name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "postgresql-exporter.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ .name }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
      labels:
        {{- include "postgresql-exporter.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ .name }}
    spec:
      containers:
      - name: postgresql-exporter
        image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        ports:
        - name: metrics
          containerPort: 9187
          protocol: TCP
        env:
        - name: DATA_SOURCE_NAME
          valueFrom:
            secretKeyRef:
              name: {{ include "postgresql-exporter.fullname" $ }}-{{ .name }}
              key: data-source-name
        - name: PG_EXPORTER_AUTO_DISCOVER_DATABASES
          value: {{ $.Values.config.autoDiscoverDatabases | quote }}
        - name: PG_EXPORTER_EXCLUDE_DATABASES
          value: {{ join "," $.Values.config.excludeDatabases | quote }}
        - name: PG_EXPORTER_INCLUDE_DATABASES
          value: {{ join "," $.Values.config.includeDatabases | quote }}
        - name: PG_EXPORTER_DISABLE_SETTINGS_METRICS
          value: "false"  # Enable settings metrics for better monitoring
        - name: PG_EXPORTER_WEB_LISTEN_ADDRESS
          value: "0.0.0.0:9187"
        {{- if $.Values.config.customQueries }}
        - name: PG_EXPORTER_EXTEND_QUERY_PATH
          value: "/etc/postgres_exporter/queries.yaml"
        {{- end }}
        resources:
          {{- toYaml $.Values.resources | nindent 10 }}
        {{- if $.Values.config.customQueries }}
        volumeMounts:
        - name: queries-config
          mountPath: /etc/postgres_exporter
          readOnly: true
        {{- end }}
        livenessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 300
          periodSeconds: 120
          timeoutSeconds: 60
          failureThreshold: 15
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 15
          failureThreshold: 8
      {{- if $.Values.config.customQueries }}
      volumes:
      - name: queries-config
        configMap:
          name: {{ include "postgresql-exporter.fullname" $ }}-queries
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
