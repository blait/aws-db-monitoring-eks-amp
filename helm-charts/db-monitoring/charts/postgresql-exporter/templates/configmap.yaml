{{- if .Values.config.customQueries }}
# Custom queries are deprecated in postgres_exporter
# Using built-in collectors instead for better stability and support
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgresql-exporter.fullname" . }}-queries
  namespace: {{ .Values.global.namespace | default "observability" }}
  labels:
    {{- include "postgresql-exporter.labels" . | nindent 4 }}
data:
  queries.yaml: |
    # Empty - using built-in collectors
{{- end }}
