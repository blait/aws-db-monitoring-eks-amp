apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "adot-collector.fullname" . }}-config
  namespace: {{ .Values.global.namespace | default "observability" }}
  labels:
    {{- include "adot-collector.labels" . | nindent 4 }}
data:
  adot-collector-config.yaml: |
    receivers:
      prometheus:
        config:
          global:
            scrape_interval: {{ .Values.config.scrapeInterval }}
            scrape_timeout: {{ .Values.config.scrapeTimeout }}

          scrape_configs:
          # Kubernetes API Server metrics
          - job_name: kubernetes-apiservers
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            kubernetes_sd_configs:
            - role: endpoints
            relabel_configs:
            - action: keep
              regex: default;kubernetes;https
              source_labels:
              - __meta_kubernetes_namespace
              - __meta_kubernetes_service_name
              - __meta_kubernetes_endpoint_port_name
            scheme: https
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              insecure_skip_verify: true

          # Kubernetes Node metrics
          - job_name: kubernetes-nodes
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            kubernetes_sd_configs:
            - role: node
            relabel_configs:
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - replacement: kubernetes.default.svc:443
              target_label: __address__
            - regex: (.+)
              replacement: /api/v1/nodes/$$1/proxy/metrics
              source_labels:
              - __meta_kubernetes_node_name
              target_label: __metrics_path__
            scheme: https
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              insecure_skip_verify: true

          # Kubernetes cAdvisor metrics
          - job_name: kubernetes-nodes-cadvisor
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            kubernetes_sd_configs:
            - role: node
            relabel_configs:
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - replacement: kubernetes.default.svc:443
              target_label: __address__
            - regex: (.+)
              replacement: /api/v1/nodes/$$1/proxy/metrics/cadvisor
              source_labels:
              - __meta_kubernetes_node_name
              target_label: __metrics_path__
            scheme: https
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              insecure_skip_verify: true

          # Service endpoints with prometheus annotations
          - job_name: kubernetes-service-endpoints
            kubernetes_sd_configs:
            - role: endpoints
            relabel_configs:
            - action: keep
              regex: true
              source_labels:
              - __meta_kubernetes_service_annotation_prometheus_io_scrape
            - action: replace
              regex: (https?)
              source_labels:
              - __meta_kubernetes_service_annotation_prometheus_io_scheme
              target_label: __scheme__
            - action: replace
              regex: (.+)
              source_labels:
              - __meta_kubernetes_service_annotation_prometheus_io_path
              target_label: __metrics_path__
            - action: replace
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $$1:$$2
              source_labels:
              - __address__
              - __meta_kubernetes_service_annotation_prometheus_io_port
              target_label: __address__
            - action: labelmap
              regex: __meta_kubernetes_service_label_(.+)
            - action: replace
              source_labels:
              - __meta_kubernetes_namespace
              target_label: kubernetes_namespace
            - action: replace
              source_labels:
              - __meta_kubernetes_service_name
              target_label: kubernetes_name

          # MySQL Exporters - Static configuration (cluster-based)
          - job_name: mysql-exporters
            static_configs:
            - targets:
              - mysql-cluster.{{ .Values.global.namespace | default "observability" }}.svc.cluster.local:9104
              labels:
                job: mysql-exporters
                kubernetes_namespace: {{ .Values.global.namespace | default "observability" }}

          # PostgreSQL Exporters - Static configuration (cluster-based)
          - job_name: postgresql-exporters
            static_configs:
            - targets:
              - postgresql-cluster.{{ .Values.global.namespace | default "observability" }}.svc.cluster.local:9187
              labels:
                job: postgresql-exporters
                kubernetes_namespace: {{ .Values.global.namespace | default "observability" }}
    
          # Redis Exporters - Static configuration (cluster-based)
          - job_name: redis-exporters
            static_configs:
            - targets:
              - redis-exporter.{{ .Values.global.namespace | default "observability" }}.svc.cluster.local:9121 # redis-exporter 서비스 이름과 포트
              labels:
                job: redis-exporters
                kubernetes_namespace: {{ .Values.global.namespace | default "observability" }}

          # SQL Server Exporter - Static configuration
          - job_name: sql-exporter
            static_configs:
            - targets:
              - {{ include "db-monitoring.fullname" . }}-sql-exporter.{{ .Values.global.namespace | default "observability" }}.svc.cluster.local:9399
              labels:
                job: sql-exporter
                kubernetes_namespace: {{ .Values.global.namespace | default "observability" }}

    processors:
      batch:
        timeout: 5s
        send_batch_size: 512

    exporters:
      prometheusremotewrite:
        endpoint: {{ .Values.amp.endpoint }}
        timeout: 60s
        auth:
          authenticator: sigv4auth
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      sigv4auth:
        region: {{ .Values.amp.region | default .Values.global.region }}
        service: aps

    service:
      extensions: [health_check, sigv4auth]
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [batch]
          exporters: [prometheusremotewrite]
      telemetry:
        logs:
          level: info
