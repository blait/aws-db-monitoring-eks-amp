suite: test serviceaccount template
templates:
  - serviceaccount.yaml
tests:
  - it: should render ServiceAccount with default values
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-aurora-discovery
      - equal:
          path: metadata.namespace
          value: observability
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: aurora-discovery
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/managed-by: Helm

  - it: should include IRSA annotations when provided
    set:
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/aurora-discovery-role"
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: "arn:aws:iam::123456789012:role/aurora-discovery-role"

  - it: should include multiple annotations when provided
    set:
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/aurora-discovery-role"
        custom.annotation/key: "custom-value"
        another.annotation/key: "another-value"
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: "arn:aws:iam::123456789012:role/aurora-discovery-role"
      - equal:
          path: metadata.annotations["custom.annotation/key"]
          value: "custom-value"
      - equal:
          path: metadata.annotations["another.annotation/key"]
          value: "another-value"

  - it: should use custom ServiceAccount name when provided
    set:
      serviceAccount.name: custom-service-account
    asserts:
      - equal:
          path: metadata.name
          value: custom-service-account

  - it: should use custom namespace when provided
    set:
      kubernetes.namespace: custom-namespace
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-namespace

  - it: should use global namespace when provided
    set:
      global.namespace: global-namespace
    asserts:
      - equal:
          path: metadata.namespace
          value: global-namespace

  - it: should prefer global namespace over local namespace
    set:
      global.namespace: global-namespace
      kubernetes.namespace: local-namespace
    asserts:
      - equal:
          path: metadata.namespace
          value: global-namespace

  - it: should not render when serviceAccount.create is false
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render with custom fullname override
    set:
      fullnameOverride: custom-aurora-discovery
    asserts:
      - equal:
          path: metadata.name
          value: custom-aurora-discovery

  - it: should render with name override
    set:
      nameOverride: custom-name
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-custom-name

  - it: should handle empty annotations gracefully
    set:
      serviceAccount.annotations: {}
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-aurora-discovery

  - it: should not have annotations section when no annotations provided
    set:
      serviceAccount.annotations: null
    asserts:
      - isKind:
          of: ServiceAccount
      - isNull:
          path: metadata.annotations

  - it: should include chart version in labels when available
    chart:
      appVersion: "1.0.0"
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: "1.0.0"

  - it: should validate IRSA annotation format
    set:
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/AuroraDiscoveryRole"
        eks.amazonaws.com/audience: "sts.amazonaws.com"
        eks.amazonaws.com/token-expiration: "86400"
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: "arn:aws:iam::123456789012:role/AuroraDiscoveryRole"
      - equal:
          path: metadata.annotations["eks.amazonaws.com/audience"]
          value: "sts.amazonaws.com"
      - equal:
          path: metadata.annotations["eks.amazonaws.com/token-expiration"]
          value: "86400"