suite: test cronjob template
templates:
  - cronjob.yaml
tests:
  - it: should render cronjob with default values
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: metadata.name
          value: RELEASE-NAME-aurora-discovery
      - equal:
          path: spec.schedule
          value: "0 * * * *"
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid
      - equal:
          path: spec.failedJobsHistoryLimit
          value: 3
      - equal:
          path: spec.successfulJobsHistoryLimit
          value: 1
      - equal:
          path: spec.jobTemplate.spec.backoffLimit
          value: 2
      - equal:
          path: spec.jobTemplate.spec.template.spec.restartPolicy
          value: OnFailure
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: RELEASE-NAME-aurora-discovery
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].name
          value: aurora-discovery
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: "aurora-discovery:1.0.0"
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent

  - it: should render cronjob with custom values
    set:
      schedule: "0 */2 * * *"
      image.repository: custom-aurora-discovery
      image.tag: "2.0.0"
      image.pullPolicy: Always
      cronJob.concurrencyPolicy: Allow
      cronJob.failedJobsHistoryLimit: 5
      cronJob.successfulJobsHistoryLimit: 3
      cronJob.backoffLimit: 3
      cronJob.restartPolicy: Never
    asserts:
      - equal:
          path: spec.schedule
          value: "0 */2 * * *"
      - equal:
          path: spec.concurrencyPolicy
          value: Allow
      - equal:
          path: spec.failedJobsHistoryLimit
          value: 5
      - equal:
          path: spec.successfulJobsHistoryLimit
          value: 3
      - equal:
          path: spec.jobTemplate.spec.backoffLimit
          value: 3
      - equal:
          path: spec.jobTemplate.spec.template.spec.restartPolicy
          value: Never
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: "custom-aurora-discovery:2.0.0"
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].imagePullPolicy
          value: Always

  - it: should set environment variables correctly
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: AWS_REGION
            value: "us-east-1"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: NAMESPACE
            value: "observability"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: STATE_CONFIGMAP_NAME
            value: "aurora-discovery-state"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
            value: "INFO"

  - it: should set environment variables with custom values
    set:
      aws.region: "us-west-2"
      kubernetes.namespace: "monitoring"
      state.configMapName: "custom-state"
      logging.level: "DEBUG"
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: AWS_REGION
            value: "us-west-2"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: NAMESPACE
            value: "monitoring"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: STATE_CONFIGMAP_NAME
            value: "custom-state"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
            value: "DEBUG"

  - it: should set resource limits and requests
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.requests.cpu
          value: "200m"
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.requests.memory
          value: "256Mi"
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.limits.cpu
          value: "500m"
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.limits.memory
          value: "512Mi"

  - it: should set security context correctly
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.runAsUser
          value: 65534
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.fsGroup
          value: 65534
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.runAsGroup
          value: 65534
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.runAsUser
          value: 65534

  - it: should not render when disabled
    set:
      enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should include proper labels
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: aurora-discovery
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/managed-by: Helm
      - isSubset:
          path: spec.jobTemplate.spec.template.metadata.labels
          content:
            app.kubernetes.io/name: aurora-discovery
            app.kubernetes.io/instance: RELEASE-NAME