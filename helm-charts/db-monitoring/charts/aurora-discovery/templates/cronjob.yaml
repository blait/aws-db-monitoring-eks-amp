{{- if .Values.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "aurora-discovery.fullname" . }}
  namespace: {{ include "aurora-discovery.namespace" . }}
  labels:
    {{- include "aurora-discovery.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: {{ .Values.cronJob.concurrencyPolicy }}
  failedJobsHistoryLimit: {{ .Values.cronJob.failedJobsHistoryLimit }}
  successfulJobsHistoryLimit: {{ .Values.cronJob.successfulJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.cronJob.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "aurora-discovery.selectorLabels" . | nindent 12 }}
        spec:
          serviceAccountName: {{ include "aurora-discovery.serviceAccountName" . }}
          restartPolicy: {{ .Values.cronJob.restartPolicy }}
          containers:
          - name: aurora-discovery
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            imagePullPolicy: {{ .Values.image.pullPolicy }}
            env:
            - name: AWS_REGION
              value: {{ include "aurora-discovery.awsRegion" . | quote }}
            - name: NAMESPACE
              value: {{ include "aurora-discovery.namespace" . | quote }}
            - name: STATE_CONFIGMAP_NAME
              value: {{ .Values.state.configMapName | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            {{- if .Values.metrics.enabled }}
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
            resources:
              {{- toYaml .Values.resources | nindent 14 }}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 65534
              capabilities:
                drop:
                - ALL
          securityContext:
            fsGroup: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
{{- end }}