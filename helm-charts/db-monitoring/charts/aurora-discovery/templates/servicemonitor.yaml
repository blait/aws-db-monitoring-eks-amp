{{- if .Values.alerting.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "aurora-discovery.fullname" . }}
  namespace: {{ include "aurora-discovery.namespace" . }}
  labels:
    {{- include "aurora-discovery.labels" . | nindent 4 }}
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      {{- include "aurora-discovery.selectorLabels" . | nindent 6 }}
  endpoints:
  - port: metrics
    path: {{ .Values.metrics.path }}
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: true
  namespaceSelector:
    matchNames:
    - {{ include "aurora-discovery.namespace" . }}
{{- end }}