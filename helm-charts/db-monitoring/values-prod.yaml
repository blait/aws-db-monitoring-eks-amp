# Production environment values
global:
  namespace: observability
  region: us-east-1
  clusterName: ""
  rbac:
    create: true

# Amazon Managed Prometheus configuration
amp:
  workspaceId: ""
  endpoint: ""
  region: us-east-1

# ADOT Collector configuration - values passed to subchart
adot-collector:
  enabled: true
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  config:
    scrapeInterval: 15s
    scrapeTimeout: 10s
  amp:
    endpoint: ""
    region: us-east-1

# MySQL Exporter configuration - monitor primary instance (represents cluster)
mysql-exporter:
  enabled: true
  instances:
    - name: mysql-cluster
      endpoint: ""  # Will be set to primary MySQL endpoint (instance-1)
      port: 3306
      username: admin
      password: adminadmin
      enabled: true
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# PostgreSQL Exporter configuration - monitor primary instance (represents cluster)
postgresql-exporter:
  enabled: true
  instances:
    - name: postgresql-cluster
      endpoint: ""  # Will be set to primary PostgreSQL endpoint (instance-1)
      port: 5432
      username: root
      password: rootroot
      database: postgres
      sslmode: disable
      enabled: true
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Security settings
security:
  rbac:
    create: true
  networkPolicy:
    enabled: true
