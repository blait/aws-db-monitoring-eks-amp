apiVersion: v2
name: db-monitoring
description: A Helm chart for comprehensive database monitoring with ADOT, AMP, and AMG
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - monitoring
  - database
  - prometheus
  - grafana
  - mysql
  - postgresql
  - adot
  - amp
  - amg
home: https://github.com/aws-samples/db-monitoring-eks-amp
sources:
  - https://github.com/aws-samples/db-monitoring-eks-amp
maintainers:
  - name: AWS Samples
    email: aws-samples@amazon.com
dependencies:
  - name: adot-collector
    version: "1.0.0"
    condition: adot.enabled
  - name: mysql-exporter
    version: "1.0.0"
    condition: mysql.enabled
  - name: postgresql-exporter
    version: "1.0.0"
    condition: postgresql.enabled
  - name: redis-exporter
    version: "1.0.0" # redis-exporter의 실제 버전
    repository: "file://./charts/redis-exporter" # 로컬 경로
    condition: redis.enabled
