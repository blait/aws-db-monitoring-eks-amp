apiVersion: v2
name: db-monitoring
description: A Helm chart for comprehensive database monitoring with ADOT, AMP, and AMG
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - monitoring
  - database
  - prometheus
  - grafana
  - mysql
  - postgresql
  - adot
  - amp
  - amg
home: https://github.com/aws-samples/db-monitoring-eks-amp
sources:
  - https://github.com/aws-samples/db-monitoring-eks-amp
maintainers:
  - name: AWS Samples
    email: aws-samples@amazon.com
dependencies:
  - name: adot-collector
    version: "1.0.0"
    condition: adot.enabled
  - name: mysql-exporter
    version: "1.0.0"
    condition: mysql.enabled
  - name: postgresql-exporter
    version: "1.0.0"
    condition: postgresql.enabled
  - name: redis-exporter
    version: "1.0.0"
    repository: "file://./charts/redis-exporter"
    condition: redis-exporter.enabled
  - name: pi-exporter
    version: "1.0.0"
    repository: "file://./charts/pi-exporter"
    condition: pi-exporter.enabled
  - name: sql-exporter
    version: "0.1.0"
    condition: sql-exporter.enabled