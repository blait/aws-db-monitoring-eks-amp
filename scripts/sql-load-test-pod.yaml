apiVersion: v1
kind: Pod
metadata:
  name: sql-load-test
  namespace: observability
spec:
  containers:
  - name: sql-load-test
    image: python:3.11-slim
    command: ["/bin/bash"]
    args: ["-c", "while true; do sleep 3600; done"]
    env:
    - name: SQLSERVER_ENDPOINT
      value: "integrated-db-monitoring-db-sqlserverinstance-lac5d7zarcm7.cxigkyeqswhr.ap-northeast-2.rds.amazonaws.com"
    - name: SQLSERVER_USERNAME
      value: "admin"
    - name: SQLSERVER_PASSWORD
      value: "AdminAdmin123!"
  restartPolicy: Never