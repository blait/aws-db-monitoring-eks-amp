apiVersion: v1
kind: Service
metadata:
  name: test-dynamic-service
  namespace: observability
  labels:
    app: test-app
    component: test
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: test-app
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Pod
metadata:
  name: test-dynamic-pod
  namespace: observability
  labels:
    app: test-app
spec:
  containers:
  - name: nginx
    image: nginx:alpine
    ports:
    - containerPort: 8080
      name: metrics
