apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: observability
  annotations:
    eks.amazonaws.com/role-arn: ${GRAFANA_ROLE_ARN}

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-security-groups: ${GRAFANA_SG_ID}
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app: grafana

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      serviceAccountName: grafana
      containers:
        - name: grafana
          image: grafana/grafana:9.5.2
          ports:
            - containerPort: 3000
          env:
            - name: AWS_REGION
              value: ${AWS_REGION}
            - name: AWS_SDK_LOAD_CONFIG
              value: "true"
            - name: GF_AUTH_SIGV4_AUTH_ENABLED
              value: "true"
          volumeMounts:
            - name: grafana-config
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: grafana-dashboards-config
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards/default
              readOnly: true
      volumes:
        - name: grafana-config
          configMap:
            name: grafana-datasources
        - name: grafana-dashboards-config
          configMap:
            name: grafana-dashboards-config
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: "amp"
      type: "prometheus"
      url: "${AMP_ENDPOINT}"
      access: "proxy"
      isDefault: false
      jsonData:
        sigV4Auth: true
        sigV4AuthType: "default"
        sigV4Region: "${AWS_REGION}"
    - name: "cloudwatch"
      type: "cloudwatch"
      jsonData:
        authType: "default"
        defaultRegion: "${AWS_REGION}"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: "default"
      orgId: 1
      folder: ""
      type: "file"
      disableDeletion: false
      editable: true
      options:
        path: "/var/lib/grafana/dashboards/default"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
data:
  mysql.json: |
    ${MYSQL_DASHBOARD}
  postgresql.json: |
    ${POSTGRESQL_DASHBOARD} 